name: Fix Enemy Stopwatch Overlay
on:
  push:
    paths:
      - scripts/fix_enemy_stopwatch_overlay.py
      - .github/workflows/fix-enemy-stopwatch-overlay.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply stopwatch overlay fix
        run: python3 scripts/fix_enemy_stopwatch_overlay.py
      - name: Source assertions
        run: |
          grep -q 'className={styles.enemyVisual}' app/rpg/RPGPuzzleBattle.tsx
          grep -q 'className={styles.enemyInfo}' app/rpg/RPGPuzzleBattle.tsx
          grep -q 'enemyVisual .skipEnemyOverlay' app/rpg/RPGPuzzleBattle.module.css
      - name: Install dependencies
        run: npm ci
      - name: Puzzle RPG TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Commit fix
        run: |
          rm scripts/fix_enemy_stopwatch_overlay.py
          rm .github/workflows/fix-enemy-stopwatch-overlay.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/rpg/RPGPuzzleBattle.tsx app/rpg/RPGPuzzleBattle.module.css PROGRESS.md scripts/fix_enemy_stopwatch_overlay.py .github/workflows/fix-enemy-stopwatch-overlay.yml
          git commit -m 'Fix enemy stopwatch overlay rendering'
          git push origin main
