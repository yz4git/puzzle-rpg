name: Prism Overdrive Final Targeted QA
on:
  push:
    paths:
      - '.github/workflows/apply-overdrive-nonstop-v3.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Apply redesign from retained payload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          w=Path('.github/workflows/apply-overdrive-nonstop-v2.yml').read_text()
          parts=re.findall(r"echo '([^']+)' (?:>|>>) /tmp/patch\.b64", w)
          assert len(parts)==2, len(parts)
          code=base64.b64decode(''.join(parts)).decode()
          exec(compile(code,'overdrive-patch.py','exec'),{'__name__':'__main__'})
          PY
      - run: npm ci
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Browser QA setup
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
          bash scripts/sites-env.sh -- ./node_modules/.bin/vinext start --port 4173 >/tmp/overdrive-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
      - name: Nonstop gameplay QA
        run: |
          mkdir -p /tmp/overdrive-qa
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          w=Path('.github/workflows/apply-overdrive-nonstop-v2.yml').read_text()
          m=re.search(r"echo '([^']+)' \| base64 -d > /tmp/overdrive-qa\.mjs",w)
          assert m
          Path('qa-overdrive.mjs').write_bytes(base64.b64decode(m.group(1)))
          PY
          node qa-overdrive.mjs
          rm qa-overdrive.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: prism-overdrive-nonstop-qa
          path: /tmp/overdrive-qa
          retention-days: 1
      - name: Commit implementation and cleanup
        run: |
          rm -f .github/workflows/apply-overdrive-nonstop.yml .github/workflows/apply-overdrive-nonstop-v2.yml .github/workflows/apply-overdrive-nonstop-v3.yml .github/workflows/qa-overdrive-review.yml
          git config user.name 'yz4git'
          git config user.email '65384484+yz4git@users.noreply.github.com'
          git add app/PrismOverdrive.tsx app/PrismOverdrive.module.css .github/workflows
          git commit -m 'Redesign Prism Overdrive for nonstop flow'
          git push origin HEAD:main
