name: Prism Overdrive Route Mission Pass
on:
  push:
    paths:
      - 'scripts/pass-overdrive-route-mission.py'
      - '.github/workflows/pass-overdrive-route-mission.yml'
jobs:
  pass:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Apply route mission pass
        run: python3 scripts/pass-overdrive-route-mission.py
      - run: npm ci
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Browser QA setup
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install chromium
          bash scripts/sites-env.sh -- ./node_modules/.bin/vinext start --port 4173 >/tmp/route-mission-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
      - name: Route and boss core gameplay QA
        run: |
          mkdir -p /tmp/route-mission-qa
          cat > qa-route-mission.mjs <<'NODE'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const errors=[];
          const page=await browser.newPage({viewport:{width:402,height:874},deviceScaleFactor:1});
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
          await page.getByRole('button',{name:/PRISM OVERDRIVE/}).click();
          await page.getByRole('button',{name:/START OVERDRIVE/}).click();
          const board=page.locator('[aria-label="Prism Overdrive Cluster Break board"]'); await board.waitFor();
          const mission=page.locator('[class*="missionCard"]');
          const scan=page.locator('[class*="scanCard"]');
          const strategy=page.locator('[aria-label="Overdrive strategy panel"]');
          let routeSeen=false, routeExecuted=false;
          for(let turn=0;turn<26;turn++){
            const ready=await page.locator('[class*="routeReady"]').count();
            if(ready>0){
              routeSeen=true;
              await page.screenshot({path:'/tmp/route-mission-qa/01-route-ready.jpg',type:'jpeg',quality:92});
              await page.locator('[class*="routeReady"]:not([disabled])').first().click();
              for(let i=0;i<80;i++){
                await page.waitForTimeout(45);
                const text=(await page.locator('body').innerText()).toUpperCase();
                if(text.includes('PLANNED ROUTE')||text.includes('SCAN ROUTE CONNECTED')){routeExecuted=true;await page.screenshot({path:'/tmp/route-mission-qa/02-route-hit.jpg',type:'jpeg',quality:92});break;}
                const enabled=await board.locator('button:not([disabled])').count(); if(enabled>0&&i>30) break;
              }
              if(routeExecuted) break;
            }
            const buttons=board.locator('button:not([disabled])');
            await buttons.first().waitFor({state:'visible',timeout:15000});
            await buttons.first().click();
            await board.locator('button:not([disabled])').first().waitFor({timeout:15000});
          }

          // Deterministic all-ATK run repeatedly completes color targets and must eventually spawn BOSS CORE.
          const boss=await browser.newPage({viewport:{width:402,height:874},deviceScaleFactor:1});
          boss.on('pageerror',e=>errors.push(String(e)));
          await boss.addInitScript(()=>{Math.random=()=>0.1});
          await boss.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
          await boss.getByRole('button',{name:/PRISM OVERDRIVE/}).click();
          await boss.getByRole('button',{name:/START OVERDRIVE/}).click();
          const bb=boss.locator('[aria-label="Prism Overdrive Cluster Break board"]'); await bb.waitFor();
          let bossSpawned=false;
          for(let turn=0;turn<8;turn++){
            await bb.locator('button:not([disabled])').first().waitFor({timeout:15000});
            await bb.locator('button:not([disabled])').first().click();
            for(let i=0;i<90;i++){
              await boss.waitForTimeout(50);
              const m=boss.locator('[class*="missionCard"][data-boss="active"]');
              if(await m.isVisible().catch(()=>false)){bossSpawned=true;await boss.screenshot({path:'/tmp/route-mission-qa/03-boss-core.jpg',type:'jpeg',quality:92});break;}
              if(await bb.locator('button:not([disabled])').count()>0&&i>30) break;
            }
            if(bossSpawned)break;
          }

          const b=await board.boundingBox(); const feed=await page.locator('[class*="actionFeed"]').boundingBox();
          const result={errors,routeSeen,routeExecuted,bossSpawned,missionCount:await mission.count(),scanText:await scan.innerText(),strategyHeight:(await strategy.boundingBox())?.height,scrollWidth:await page.evaluate(()=>document.documentElement.scrollWidth),innerWidth:await page.evaluate(()=>innerWidth),board:b,feed};
          fs.writeFileSync('/tmp/route-mission-qa/review.json',JSON.stringify(result,null,2));
          if(errors.length) throw new Error(errors.join('\n'));
          if(!bossSpawned) throw new Error(`boss core did not spawn ${JSON.stringify(result)}`);
          if(result.missionCount!==1) throw new Error(`mission card missing ${JSON.stringify(result)}`);
          if(result.scrollWidth>result.innerWidth) throw new Error('horizontal overflow');
          if(b&&feed&&feed.y<b.y+b.height) throw new Error('action feed overlaps board');
          // Route occurrence is board-dependent. If a route was shown, it must be executable.
          if(routeSeen&&!routeExecuted) throw new Error(`route hint was not executable ${JSON.stringify(result)}`);
          await browser.close();
          NODE
          node qa-route-mission.mjs
          rm qa-route-mission.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: prism-overdrive-route-mission-qa
          path: /tmp/route-mission-qa
          retention-days: 1
      - name: Commit and cleanup
        run: |
          rm -f scripts/pass-overdrive-route-mission.py .github/workflows/pass-overdrive-route-mission.yml
          git config user.name 'yz4git'
          git config user.email '65384484+yz4git@users.noreply.github.com'
          git add app/PrismOverdrive.tsx app/PrismOverdrive.module.css app/gameAudio.ts scripts .github/workflows
          git commit -m 'Add planned routes and Boss Core loop to Prism Overdrive'
          git push origin HEAD:main
