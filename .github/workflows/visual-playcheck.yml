name: Visual Playcheck

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-playcheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start app
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/puzzle-rpg-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/puzzle-rpg-vite.log
          exit 1
      - name: Visual and play check
        run: |
          mkdir -p visual-check
          cat > /tmp/qa-visual.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ headless: true });
          const report = { views: [], turns: [], errors: [] };
          const viewports = [
            { name: 'iphone402x874', width: 402, height: 874 },
            { name: 'compact390x844', width: 390, height: 844 },
          ];

          function parseBoard(cells) {
            const board = Array.from({ length: 6 }, () => Array(6).fill(''));
            for (const cell of cells) {
              const m = cell.label.match(/^(fire|water|light|heart|guard) orb row (\d+) column (\d+)$/);
              if (m) board[Number(m[2]) - 1][Number(m[3]) - 1] = m[1];
            }
            return board;
          }

          function clone(board) { return board.map(r => [...r]); }
          function swap(board, a, b) {
            const n = clone(board);
            [n[a.r][a.c], n[b.r][b.c]] = [n[b.r][b.c], n[a.r][a.c]];
            return n;
          }
          function matches(board) {
            const out = new Set();
            for (let r = 0; r < 6; r++) {
              let s = 0;
              for (let c = 1; c <= 6; c++) {
                if (c < 6 && board[r][c] === board[r][s]) continue;
                if (c - s >= 3) for (let x = s; x < c; x++) out.add(`${r}:${x}`);
                s = c;
              }
            }
            for (let c = 0; c < 6; c++) {
              let s = 0;
              for (let r = 1; r <= 6; r++) {
                if (r < 6 && board[r][c] === board[s][c]) continue;
                if (r - s >= 3) for (let y = s; y < r; y++) out.add(`${y}:${c}`);
                s = r;
              }
            }
            return out;
          }
          const pairs = [];
          for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++) {
            if (c < 5) pairs.push([{r,c},{r,c:c+1}]);
            if (r < 5) pairs.push([{r,c},{r:r+1,c}]);
          }
          function countImmediate(board) {
            let n = 0;
            for (const [a,b] of pairs) if (matches(swap(board,a,b)).size) n++;
            return n;
          }
          function chooseMove(board, intentText, hp) {
            let best = null;
            for (const [a,b] of pairs) {
              const next = swap(board,a,b);
              const m = matches(next);
              if (!m.size) continue;
              const colors = [...m].map(k => { const [r,c] = k.split(':').map(Number); return next[r][c]; });
              let score = m.size * 2;
              score += colors.filter(x => x === 'fire' || x === 'water' || x === 'light').length * 3;
              if (/CRUSH|BLOOD RITE|PRISM HIT|ATTACK/.test(intentText)) score += colors.filter(x => x === 'guard').length * 5;
              if (hp < 65) score += colors.filter(x => x === 'heart').length * 6;
              if (!best || score > best.score) best = { a, b, score, setup: false };
            }
            if (best) return best;
            for (const [a,b] of pairs) {
              const next = swap(board,a,b);
              const score = countImmediate(next);
              if (!best || score > best.score) best = { a, b, score, setup: true };
            }
            return best;
          }

          for (let vi = 0; vi < viewports.length; vi++) {
            const vp = viewports[vi];
            const context = await browser.newContext({
              viewport: { width: vp.width, height: vp.height },
              isMobile: true,
              hasTouch: true,
              deviceScaleFactor: 2,
            });
            const page = await context.newPage();
            page.on('console', msg => { if (msg.type() === 'error') report.errors.push(`console: ${msg.text()}`); });
            page.on('pageerror', err => report.errors.push(`pageerror: ${err.message}`));
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.screenshot({ path: `visual-check/${vp.name}-initial.png`, fullPage: true });
            const metrics = await page.evaluate(() => {
              const q = s => document.querySelector(s)?.getBoundingClientRect();
              const board = q('[aria-label="puzzle board"]');
              const enemy = q('[aria-label="enemy status"]');
              const intents = q('[aria-label="enemy intents"]');
              const next = q('[aria-label="column next puzzle orbs"]');
              const skill = [...document.querySelectorAll('button')].find(b => b.textContent?.includes('PRISM SHIFT'))?.getBoundingClientRect();
              const buttons = [...document.querySelectorAll('button')].map(b => {
                const r = b.getBoundingClientRect();
                return { text: b.textContent?.trim(), x:r.x,y:r.y,w:r.width,h:r.height, visible:r.bottom>0&&r.top<innerHeight };
              });
              return {
                viewport: [innerWidth, innerHeight],
                body: [document.documentElement.scrollWidth, document.documentElement.scrollHeight],
                board: board && {x:board.x,y:board.y,w:board.width,h:board.height,bottom:board.bottom},
                enemy: enemy && {x:enemy.x,y:enemy.y,w:enemy.width,h:enemy.height,bottom:enemy.bottom},
                intents: intents && {x:intents.x,y:intents.y,w:intents.width,h:intents.height,bottom:intents.bottom},
                next: next && {x:next.x,y:next.y,w:next.width,h:next.height,bottom:next.bottom},
                skill: skill && {x:skill.x,y:skill.y,w:skill.width,h:skill.height,bottom:skill.bottom},
                hiddenButtons: buttons.filter(b => !b.visible),
                text: document.body.innerText,
              };
            });
            report.views.push({ name: vp.name, ...metrics });

            if (vi === 0) {
              for (let turn = 1; turn <= 14; turn++) {
                const cells = await page.locator('button[aria-label*=" orb row "]').evaluateAll(btns => btns.map(b => ({ label: b.getAttribute('aria-label') || '' })));
                const board = parseBoard(cells);
                const intentText = await page.locator('[aria-label="enemy intents"]').innerText();
                const playerText = await page.locator('[aria-label="player status"]').innerText();
                const hpMatch = playerText.match(/HP\s*(\d+)/);
                const hp = hpMatch ? Number(hpMatch[1]) : 100;
                const move = chooseMove(board, intentText, hp);
                if (!move) break;
                const labelA = `${board[move.a.r][move.a.c]} orb row ${move.a.r+1} column ${move.a.c+1}`;
                const labelB = `${board[move.b.r][move.b.c]} orb row ${move.b.r+1} column ${move.b.c+1}`;
                await page.getByRole('button', { name: labelA }).click();
                await page.getByRole('button', { name: labelB }).click();
                await page.waitForTimeout(180);
                const state = await page.evaluate(() => ({
                  stage: document.querySelector('[class*="stage"]')?.textContent,
                  status: document.querySelector('[role="status"]')?.textContent,
                  player: document.querySelector('[aria-label="player status"]')?.textContent,
                  enemy: document.querySelector('[aria-label="enemy status"]')?.textContent,
                  skill: [...document.querySelectorAll('button')].find(b => b.textContent?.includes('PRISM SHIFT'))?.textContent,
                  gameOver: document.body.innerText.includes('GAME OVER'),
                }));
                report.turns.push({ turn, move, ...state });
                if ([1,4,8,12,14].includes(turn)) await page.screenshot({ path: `visual-check/iphone402x874-turn-${String(turn).padStart(2,'0')}.png`, fullPage: true });
                if (state.gameOver) break;
              }
            }
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('visual-check/report.json', JSON.stringify(report, null, 2));
          EOF
          node /tmp/qa-visual.mjs
          cat visual-check/report.json
      - name: Upload visual check
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-rpg-visual-check
          path: visual-check/
          if-no-files-found: error
