name: Pass 36 Save Integrity Recovery

on:
  push:
    paths:
      - '.github/workflows/pass36-save-integrity.yml'

permissions:
  contents: write

jobs:
  save-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply save integrity recovery pass
        run: python3 scripts/pass36_save_integrity.py
      - name: Install dependencies
        run: npm ci
      - name: RPG save integrity tests
        run: node --import tsx --test tests/rpg-save-integrity.test.ts
      - name: Puzzle RPG TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Commit save integrity recovery
        run: |
          printf '%s\n' '' '## Release Candidate Pass 36 — Save Integrity & Recovery' '- Added one-generation local save backup rotation and automatic recovery when the primary JSON is malformed or missing.' '- Added tolerant migration for recognizable pre-release/versionless saves while explicitly refusing future-version saves to prevent accidental downgrade.' '- Hardened save normalization: blocked/water coordinates recover to the nearest walkable tile; duplicate inventory stacks are merged; invalid/duplicate item, equipment, technique, flag, chest and encounter data are sanitized and bounded.' '- Added targeted permanent RPG save-integrity tests to Puzzle RPG CI, including corrupted-primary recovery, future-version protection, backup rotation and storage-write failure safety.' '- Safari/private-mode/quota write failures remain non-fatal; gameplay balance, encounter tables, rewards, map topology and battle math are unchanged.' >> PROGRESS.md
          rm -f scripts/pass36_save_integrity.py .github/workflows/pass36-save-integrity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete save integrity recovery pass 36'
          git push
