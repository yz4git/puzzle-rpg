name: SFC Visual Reconstruction Pass 7B

on:
  push:
    branches:
      - visual/reconstruction-pass-sfc7b

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Pass 7 audit corrections
        run: python scripts/apply-sfc-visual-pass7b.py
      - name: Puzzle RPG TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Review diff
        run: git diff --check
      - name: Commit Pass 7 corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rpg/RPGMode.tsx PROGRESS.md
          git diff --cached --quiet && exit 0
          git commit -m "Refine SFC visual reconstruction pass 7"
          git push
