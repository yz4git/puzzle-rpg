name: QA Stopwatch Screenshot
on:
  push:
    paths:
      - 'scripts/qa-stopwatch-screenshot.mjs'
      - '.github/workflows/qa-stopwatch-screenshot.yml'
jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - name: Install project
        run: npm ci
      - name: Install browser QA dependency
        run: npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Start local production server
        run: |
          python3 -m http.server 4173 -d dist >/tmp/puzzle-rpg-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/puzzle-rpg-http.log
          exit 1
      - name: Capture stopwatch states
        run: node scripts/qa-stopwatch-screenshot.mjs
      - name: Encode screenshots
        run: |
          base64 -w0 /tmp/stopwatch-armed.jpg > qa-stopwatch-armed.b64
          base64 -w0 /tmp/stopwatch-zero.jpg > qa-stopwatch-zero.b64
          wc -c qa-stopwatch-armed.b64 qa-stopwatch-zero.b64
      - name: Commit temporary screenshot payloads
        run: |
          rm scripts/qa-stopwatch-screenshot.mjs .github/workflows/qa-stopwatch-screenshot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Capture stopwatch overlay screenshots'
          git push origin main
