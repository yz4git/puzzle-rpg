name: One-shot story goal progression fix

on:
  push:
    paths:
      - '.github/workflows/one-shot-next-goal-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch progression-aware NEXT GOAL and live regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          mode_path = Path('app/rpg/RPGMode.tsx')
          mode = mode_path.read_text()
          memo_marker = '  const activeMemo = save.memos.find((memo) => !memo.read) ?? save.memos[save.memos.length - 1];'
          goal_block = '''
          const fieldGoal = (() => {
            const flag = (id: string) => save.flags.includes(id);
            const fourSchools: TechniqueId[] = ["flameLore", "firstAid", "fortress", "timeTheft"];
            const missingSchools = fourSchools.filter((id) => !save.techniques.includes(id));
            if (flag("story:ending") || flag("boss:prismSovereign")) return { title: "旅の答え", text: "PRISM ROADに残した声と選択をMEMOで振り返る。" };
            if (flag("gate:citadel") || flag("boss:nullExecutioner")) return { title: "PRISM CITADEL", text: "北東のPRISM CITADELへ進み、PRISM SOVEREIGNと向き合う。" };
            if (flag("void:clear")) {
              if (!flag("key:mirror")) return { title: "MIRROR TOWER", text: "最後の門には鏡鍵が必要だ。北のMIRROR TOWERで鍵を得る。" };
              if (missingSchools.length) return { title: "四つの修行印", text: `残る修行は${missingSchools.length}つ。炎・癒し・鉄壁・時の師を訪ねる。` };
              return { title: "PRISM CITADEL", text: "VOIDの証・鏡鍵・四つの修行印が揃った。北東の最後の門へ進む。" };
            }
            if (flag("boss:ironTyrant")) return { title: "VOID PASS", text: "IRON CITYの北門が開いた。北東のVOID PASSを突破する。" };
            if (flag("boss:scarletOracle")) return { title: "IRON CITY", text: "SCARLET ORACLEを越えた。IRON CITYへ戻り、IRON TYRANTと向き合う。" };
            if (flag("boss:templeKeeper")) return { title: "CRIMSON MARSH", text: "古寺の橋印を得た。IRON TYRANTへの道を開くため、東のCRIMSON MARSHでSCARLET ORACLEを越える。" };
            return { title: activeMemo?.title ?? map.name, text: activeMemo?.text ?? "PRISM ROADを進み、次の手掛かりを探す。" };
          })();'''
          if memo_marker not in mode:
              raise SystemExit('activeMemo marker not found')
          mode = mode.replace(memo_marker, memo_marker + goal_block, 1)

          old_render = '<div className={styles.fieldGoal}><span>NEXT GOAL</span><strong>{activeMemo?.title ?? map.name}</strong><small>{activeMemo?.text ?? "PRISM ROADを進み、次の手掛かりを探す。"}</small></div>'
          new_render = '<div className={styles.fieldGoal}><span>NEXT GOAL</span><strong>{fieldGoal.title}</strong><small>{fieldGoal.text}</small></div>'
          if old_render not in mode:
              raise SystemExit('fieldGoal render anchor not found')
          mode_path.write_text(mode.replace(old_render, new_render, 1))

          script_path = Path('scripts/live-playcheck.mjs')
          script = script_path.read_text()
          assert_marker = "  assert('Boss victory returns to OLD TEMPLE', /OLD TEMPLE/i.test(templeReturn.text) && !/YOU AWAKEN/i.test(templeReturn.text));"
          next_assert = "\n  assert('NEXT GOAL advances from Old Temple to Crimson Marsh', /NEXT GOAL\\s+CRIMSON MARSH/i.test(templeReturn.text) && !/北のOld Templeへ向かう/i.test(templeReturn.text), { text: templeReturn.text.slice(0, 1400) });"
          if assert_marker not in script:
              raise SystemExit('boss return assertion marker not found')
          script_path.write_text(script.replace(assert_marker, assert_marker + next_assert, 1))
          PY
      - name: Commit fix and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-next-goal-fix.yml
          git add app/rpg/RPGMode.tsx scripts/live-playcheck.mjs
          git diff --cached --check
          git commit -m 'Make NEXT GOAL follow story progression'
          git push origin HEAD:main
