name: Apply Generated Pixel UI
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-generated-pixel-ui.py'
      - '.github/workflows/apply-generated-pixel-ui.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply pixel UI integration
        run: python3 scripts/apply-generated-pixel-ui.py
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Commit generated UI integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/PuzzleRPGGame.tsx app/PuzzleRPGGame.module.css
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate generated 8-bit character art and UI'
            git push origin HEAD:main
          fi
