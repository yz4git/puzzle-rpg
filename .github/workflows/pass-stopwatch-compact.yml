name: Battle Stopwatch Overlay Polish
on:
  push:
    paths:
      - '.github/workflows/pass-stopwatch-compact.yml'

jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Apply stopwatch polish
        run: python3 scripts/pass-stopwatch-compact.py
      - name: Install project
        run: npm ci
      - name: Puzzle RPG TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Install targeted browser QA
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          bash scripts/sites-env.sh -- ./node_modules/.bin/vinext start --port 4173 >/tmp/puzzle-rpg-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/puzzle-rpg-http.log
          exit 1
      - name: Capture targeted stopwatch QA
        run: |
          cat > .qa-stopwatch.mjs <<'NODE'
          import { chromium } from 'playwright';
          const save = {
            version: 1, playerName: 'LIO', level: 1, exp: 0, hp: 22, maxHp: 22, gold: 18,
            mapId: 'oldTemple', position: { x: 10, y: 15 }, direction: 'up',
            lastInn: { mapId: 'hearthVillage', position: { x: 8, y: 10 } },
            inventory: [{ id: 'timeSand', count: 1 }, { id: 'herb', count: 1 }], inventorySlots: 4,
            equipmentOwned: ['travellerCoat'], equipment: { weapon: null, armor: 'travellerCoat', charm: null },
            techniques: [], techniqueSlots: 2, memos: [], flags: ['story:openingSeen'], openedChests: [],
            defeatedEncounters: [], defeatedEnemies: {}, releasedEnemies: {}, battleLog: [], steps: 0,
            playSeconds: 0, encounterMeter: 3, settings: { music: false, sfx: false }
          };
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 402, height: 874 }, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' });
          await page.evaluate((value) => localStorage.setItem('puzzle-rpg:rpg-mode:v1', JSON.stringify(value)), save);
          await page.reload({ waitUntil: 'networkidle' });
          await page.getByRole('button', { name: /RPG MODE/ }).click();
          await page.getByRole('button', { name: /CONTINUE/ }).click();
          const board = page.locator('section[aria-label="RPG Cluster Break board"]');
          for (let i = 0; i < 6 && !(await board.isVisible().catch(() => false)); i += 1) {
            await page.getByRole('button', { name: 'Move up' }).click();
            await page.waitForTimeout(120);
          }
          await board.waitFor({ state: 'visible', timeout: 10000 });
          await page.getByRole('button', { name: /RPG COMMAND/ }).click();
          await page.getByRole('button', { name: /ITEM/ }).click();
          await page.getByRole('button', { name: /TIME SAND/ }).click();
          const armed = page.locator('[aria-label="Enemy time stop 1"]');
          await armed.waitFor({ state: 'visible', timeout: 1500 });
          const armedRow = armed.locator('xpath=../..');
          await armedRow.screenshot({ path: '/tmp/stopwatch-armed.jpg', type: 'jpeg', quality: 94 });
          const armedBox = await armed.boundingBox();
          const spriteBox = await page.locator('[role="img"][aria-label]').first().boundingBox();
          console.log('armedBox=', JSON.stringify(armedBox), 'spriteBox=', JSON.stringify(spriteBox));
          const zero = page.locator('[aria-label="Enemy time stop 0"]');
          await zero.waitFor({ state: 'visible', timeout: 3000 });
          const zeroRow = zero.locator('xpath=../..');
          await zeroRow.screenshot({ path: '/tmp/stopwatch-zero.jpg', type: 'jpeg', quality: 94 });
          console.log('zeroBox=', JSON.stringify(await zero.boundingBox()));
          await browser.close();
          NODE
          node .qa-stopwatch.mjs
      - name: Upload targeted screenshots
        uses: actions/upload-artifact@v4
        with:
          name: stopwatch-overlay-qa
          path: |
            /tmp/stopwatch-armed.jpg
            /tmp/stopwatch-zero.jpg
          retention-days: 1
      - name: Commit stopwatch polish
        run: |
          rm -f .qa-stopwatch.mjs
          rm scripts/pass-stopwatch-compact.py .github/workflows/pass-stopwatch-compact.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish enemy stopwatch overlay'
          git push origin main
