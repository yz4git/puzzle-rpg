name: Apply Early Game Review 1-5

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_early_game_review_1_5.py'
      - '.github/workflows/apply-early-game-review-1-5.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply early-game review improvements
        run: python3 scripts/apply_early_game_review_1_5.py
      - name: Install dependencies
        run: npm ci
      - name: Puzzle RPG TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Commit improvements
        run: |
          rm -f scripts/apply_early_game_review_1_5.py .github/workflows/apply-early-game-review-1-5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Implement early-game review improvements 1-5'
          git push origin HEAD:main
