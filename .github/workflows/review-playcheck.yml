name: Review playcheck
on:
  push:
    branches: [main]
    paths: ['.github/workflows/review-playcheck.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Run iPhone visual playcheck
        run: |
          cat > review-playcheck.mjs <<'JS'
          import { chromium } from 'playwright'; import fs from 'node:fs';
          fs.mkdirSync('review-playcheck',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:402,height:874},isMobile:true,hasTouch:true,deviceScaleFactor:3});
          const errors=[],turns=[],intros=[];
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())}); page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'}); await page.screenshot({path:'review-playcheck/00-title.png'});
          const titleMetrics=await page.evaluate(()=>({w:innerWidth,h:innerHeight,scrollHeight:document.documentElement.scrollHeight,hero:[...document.images].find(i=>i.alt==='Puzzle RPG hero')?.getBoundingClientRect().toJSON()}));
          await page.getByRole('button',{name:'START GAME'}).click();
          const tileClick=async i=>page.evaluate(i=>document.querySelectorAll('button[aria-label*=" orb row "]')[i]?.click(),i);
          const scoreLabel=label=>{if(!label)return-999;if(label.includes('PLATE'))return-500;let s=0;const d=label.match(/(\d+)\s*DMG/);if(d)s+=+d[1]*4;const c=label.match(/(\d+)C/);if(c)s+=+c[1]*22;if(label.includes('BREAK'))s+=120;if(label.includes('DEF'))s+=26;if(label.includes('HP'))s+=18;if(label.includes('SETUP'))s+=8;return s};
          async function stageNumber(){return page.evaluate(()=>{const a=[...document.querySelectorAll('*')].map(e=>(e.textContent||'').trim());const t=a.find(x=>/^STAGE \d+$/.test(x));const m=t?.match(/STAGE (\d+)/);return m?+m[1]:null})}
          async function dismissIntro(){const b=page.getByRole('button',{name:'BATTLE START'});if(await b.isVisible().catch(()=>false)){const s=await stageNumber()??intros.length+1;if(!intros.includes(s)){await page.screenshot({path:`review-playcheck/stage-${s}-intro.png`});intros.push(s)}await b.click();await page.waitForTimeout(160);await page.screenshot({path:`review-playcheck/stage-${s}-battle.png`})}}
          await dismissIntro(); await tileClick(14); await page.waitForTimeout(90); await page.screenshot({path:'review-playcheck/01-selection-guide.png'}); await tileClick(14);
          for(let turn=1;turn<=32;turn++){
            await dismissIntro(); if(await page.getByText('GAME OVER',{exact:true}).isVisible().catch(()=>false))break; const cs=await stageNumber()??1;if(cs>=6)break;
            const count=await page.locator('button[aria-label*=" orb row "]').count();let best=null;
            for(let i=0;i<count;i++){await tileClick(i);await page.waitForTimeout(4);const labels=await page.evaluate(()=>[...document.querySelectorAll('button[aria-label*=" orb row "]')].map((b,j)=>({j,label:(b.querySelector('small')?.textContent||'').trim()})).filter(x=>x.label));for(const x of labels){const score=scoreLabel(x.label);if(!best||score>best.score)best={a:i,b:x.j,label:x.label,score}}await tileClick(i)}
            if(!best)best={a:0,b:1,label:'fallback',score:-1};const beforeStage=await stageNumber();await tileClick(best.a);await page.waitForTimeout(20);await tileClick(best.b);
            if([1,4,8,12,16,24].includes(turn)){await page.waitForTimeout(220);await page.screenshot({path:`review-playcheck/turn-${String(turn).padStart(2,'0')}-fx.png`})}
            await page.waitForTimeout(1450);const afterStage=await stageNumber();const snap=await page.evaluate(()=>({bodyText:document.body.innerText.slice(0,1500),scrollY,scrollHeight:document.documentElement.scrollHeight,tileCount:document.querySelectorAll('button[aria-label*=" orb row "]').length,orbBackgrounds:[...document.querySelectorAll('button[aria-label*=" orb row "] > span')].slice(0,6).map(e=>getComputedStyle(e).backgroundImage)}));turns.push({turn,beforeStage,afterStage,choice:best.label,score:best.score,...snap});if([1,4,8,12,16,24].includes(turn)||afterStage!==beforeStage)await page.screenshot({path:`review-playcheck/turn-${String(turn).padStart(2,'0')}-result.png`})
          }
          await dismissIntro();await page.screenshot({path:'review-playcheck/99-final.png'});const final=await page.evaluate(()=>({scrollY,scrollHeight:document.documentElement.scrollHeight,tileCount:document.querySelectorAll('button[aria-label*=" orb row "]').length,innerWidth,innerHeight}));fs.writeFileSync('review-playcheck/report.json',JSON.stringify({titleMetrics,intros,turns,final,errors},null,2));if(errors.length)throw new Error(errors.join('\n'));if(final.tileCount!==36)throw new Error(`tile count ${final.tileCount}`);await browser.close();
          JS
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/puzzle-review.log 2>&1 & PID=$!
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node review-playcheck.mjs
          kill $PID || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-playcheck
          path: review-playcheck
