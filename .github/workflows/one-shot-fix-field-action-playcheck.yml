name: One-shot fix field action playcheck

on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-field-action-playcheck.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix field action selector and remove slow diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/live-playcheck.mjs')
          text = path.read_text()
          start = text.index('async function startFixedBattle(page, expectedName, attempts = 6) {')
          end = text.index('\n}\n\nasync function openCommand', start) + 2
          new = '''async function startFixedBattle(page, expectedName, attempts = 6) {
            const launcher = page.getByRole('button', { name: /RPG COMMAND/i }).first();
            const fieldAction = /A(?:\\s*•)?\\s*(?:CHECK|CONFRONT)/i;
            for (let attempt = 0; attempt < attempts; attempt++) {
              if (await launcher.isVisible().catch(() => false)) {
                return expectedName.test(await bodyText(page));
              }
              const action = page.getByRole('button', { name: fieldAction }).first();
              if (await action.count()) await action.tap({ force: true });
              await page.waitForTimeout(720);
            }
            const ready = await launcher.waitFor({ state: 'visible', timeout: 2500 }).then(() => true).catch(() => false);
            return ready && expectedName.test(await bodyText(page));
          }'''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          text = text[:start] + new + text[end:]
          text = text.replace('/A\\s*CHECK/i', '/A(?:\\s*•)?\\s*(?:CHECK|CONFRONT)/i')
          path.write_text(text)
          PY
      - name: Commit fix and clean runner
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-fix-field-action-playcheck.yml
          git add scripts/live-playcheck.mjs
          git commit -m 'Fix field action selectors in live playcheck'
          git push
