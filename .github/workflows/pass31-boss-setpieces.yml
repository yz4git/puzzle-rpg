name: SFC Pass 31 Boss Setpieces

on:
  push:
    paths:
      - '.github/workflows/pass31-boss-setpieces.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply boss setpiece pass
        run: python3 scripts/pass31_boss_setpieces.py
      - name: Install dependencies
        run: npm ci
      - name: Puzzle RPG TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Commit pass
        run: |
          rm -f scripts/pass31_boss_setpieces.py .github/workflows/pass31-boss-setpieces.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement SFC visual reconstruction pass 31'
          git push
