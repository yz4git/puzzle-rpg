name: Prism Overdrive Gameplay Reconstruction Finalize
on:
  push:
    paths:
      - '.github/workflows/pass-overdrive-gameplay-reconstruction-finalize.yml'
jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Apply reconstruction
        run: python3 scripts/pass-overdrive-gameplay-reconstruction.py
      - run: npm ci
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Browser QA setup
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install chromium
          bash scripts/sites-env.sh -- ./node_modules/.bin/vinext start --port 4173 >/tmp/reconstruct-final-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
      - name: Verify phase escalation and strategic UI
        run: |
          mkdir -p /tmp/gameplay-reconstruction-final-qa
          cat > qa-reconstruct-final.mjs <<'NODE'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const errors=[];
          const page=await browser.newPage({viewport:{width:402,height:874},deviceScaleFactor:1});
          page.on('pageerror',e=>errors.push(String(e)));
          await page.addInitScript(()=>{
            const realNow=performance.now.bind(performance); const base=realNow();
            Object.defineProperty(performance,'now',{configurable:true,value:()=>base+(realNow()-base)*70});
            const realSetInterval=window.setInterval.bind(window);
            Object.defineProperty(window,'setInterval',{configurable:true,value:(fn,ms,...args)=>realSetInterval(fn,Math.min(Number(ms)||0,10),...args)});
          });
          await page.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
          await page.getByRole('button',{name:/PRISM OVERDRIVE/}).click();
          await page.getByRole('button',{name:/START OVERDRIVE/}).click();
          const strategy=page.locator('[aria-label="Overdrive strategy panel"]'); await strategy.waitFor();
          const phase=page.locator('[class*="phaseCard"]');
          const chargeCount=await page.locator('[class*="chargeItem"]').count();
          const scanCount=await page.locator('[class*="scanCard"]').count();
          const cashCount=await page.locator('[class*="cashOut"]').count();
          const board=page.locator('[aria-label="Prism Overdrive Cluster Break board"]');
          const seen=[];
          for(let i=0;i<1400;i++){
            await page.waitForTimeout(8);
            const text=(await phase.innerText()).toUpperCase();
            for(const name of ['BUILD','ACCEL','OVERDRIVE','FINAL']){
              if(text.includes(name)&&!seen.includes(name)){
                seen.push(name);
                await page.screenshot({path:`/tmp/gameplay-reconstruction-final-qa/${String(seen.length).padStart(2,'0')}-${name.toLowerCase()}.jpg`,type:'jpeg',quality:92});
              }
            }
            if(seen.includes('FINAL')) break;
          }
          const b=await board.boundingBox(); const feed=await page.locator('[class*="actionFeed"]').boundingBox();
          const result={errors,seen,chargeCount,scanCount,cashCount,scrollWidth:await page.evaluate(()=>document.documentElement.scrollWidth),innerWidth:await page.evaluate(()=>innerWidth),board:b,feed};
          fs.writeFileSync('/tmp/gameplay-reconstruction-final-qa/review.json',JSON.stringify(result,null,2));
          if(errors.length) throw new Error(errors.join('\n'));
          if(chargeCount!==4||scanCount!==1||cashCount!==1) throw new Error(`strategy UI incomplete ${JSON.stringify(result)}`);
          if(!['BUILD','ACCEL','OVERDRIVE','FINAL'].every(x=>seen.includes(x))) throw new Error(`phase escalation incomplete ${JSON.stringify(result)}`);
          if(result.scrollWidth>result.innerWidth) throw new Error('horizontal overflow');
          if(b&&feed&&feed.y<b.y+b.height) throw new Error('action feed overlaps board');
          await browser.close();
          NODE
          node qa-reconstruct-final.mjs
          rm qa-reconstruct-final.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: prism-overdrive-gameplay-reconstruction-final-qa
          path: /tmp/gameplay-reconstruction-final-qa
          retention-days: 1
      - name: Commit implementation and remove temporary QA
        run: |
          rm -f scripts/pass-overdrive-gameplay-reconstruction.py
          rm -f .github/workflows/pass-overdrive-gameplay-reconstruction.yml
          rm -f .github/workflows/pass-overdrive-gameplay-reconstruction-finalize.yml
          rm -f .github/workflows/review-overdrive-gameplay.yml
          git config user.name 'yz4git'
          git config user.email '65384484+yz4git@users.noreply.github.com'
          git add app/PrismOverdrive.tsx app/PrismOverdrive.module.css app/gameAudio.ts scripts .github/workflows
          git commit -m 'Reconstruct Prism Overdrive gameplay strategy'
          git push origin HEAD:main
