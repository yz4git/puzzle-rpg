name: Prism Overdrive Persistent Onboarding
on:
  push:
    paths:
      - 'scripts/pass-overdrive-onboarding-memory.py'
jobs:
  pass:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22.13.1, cache: npm}
      - name: Apply onboarding memory pass
        run: python3 scripts/pass-overdrive-onboarding-memory.py
      - run: npm ci
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Browser QA setup
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install chromium
      - name: Onboarding memory QA
        run: |
          bash scripts/sites-env.sh -- ./node_modules/.bin/vinext start --port 4173 >/tmp/onboarding-memory.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          mkdir -p /tmp/onboarding-memory-qa
          cat > qa-onboarding-memory.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const result={errors:[],fresh:{},route:{},learned:{},scrollWidth:0,innerWidth:0};
          const b=await chromium.launch({headless:true}); const p=await b.newPage({viewport:{width:402,height:874}}); p.on('pageerror',e=>result.errors.push(String(e)));
          const board=()=>p.locator('[aria-label="Prism Overdrive Cluster Break board"]');
          const clickSuggested=async()=>{const r=p.locator('[class*="recommended"]:not([disabled])'); if(await r.count()) await r.first().click(); else await board().locator('button:not([disabled])').first().click(); await board().locator('button:not([disabled])').first().waitFor({timeout:18000});};
          try{
            await p.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'}); await p.evaluate(()=>localStorage.clear()); await p.reload({waitUntil:'networkidle'});
            await p.getByRole('button',{name:/PRISM OVERDRIVE/}).click(); await p.getByRole('button',{name:/START OVERDRIVE/}).click(); await board().waitFor();
            result.fresh.guide=await p.locator('[class*="guideBar"]').innerText(); result.fresh.hype=await p.locator('[class*="hypeRow"]').count(); await p.screenshot({path:'/tmp/onboarding-memory-qa/01-fresh.jpg',type:'jpeg',quality:94});
            for(let n=0;n<7;n++) await clickSuggested();
            result.route.guide=await p.locator('[class*="guideBar"]').innerText(); result.route.feed=await p.locator('[class*="actionFeed"]').innerText(); result.route.hype=await p.locator('[class*="hypeRow"]').count(); await p.screenshot({path:'/tmp/onboarding-memory-qa/02-route.jpg',type:'jpeg',quality:94});
            await p.evaluate(()=>localStorage.setItem('puzzle-rpg:prism-overdrive:onboarding:v1','1')); await p.reload({waitUntil:'networkidle'});
            await p.getByRole('button',{name:/PRISM OVERDRIVE/}).click(); await p.getByRole('button',{name:/START OVERDRIVE/}).click(); await board().waitFor();
            result.learned.guide=await p.locator('[class*="guideBar"]').innerText(); result.learned.hype=await p.locator('[class*="hypeRow"]').count(); result.learned.scan=await p.locator('[class*="scanCard"]').count(); result.learned.cash=await p.locator('[class*="cashOut"]').count(); await p.screenshot({path:'/tmp/onboarding-memory-qa/03-learned.jpg',type:'jpeg',quality:94});
            result.scrollWidth=await p.evaluate(()=>document.documentElement.scrollWidth); result.innerWidth=await p.evaluate(()=>innerWidth);
            if(!/STEP 1/.test(result.fresh.guide)) result.errors.push('fresh run did not start tutorial');
            if(result.fresh.hype!==0) result.errors.push('fresh run exposes hype too early');
            if(!/STEP 4/.test(result.route.guide)) result.errors.push('route lesson missing');
            if(!/ROUTE/.test(result.route.feed) || /BOSS CORE/.test(result.route.feed)) result.errors.push('route feed too advanced');
            if(!/PRISM OVERDRIVE/.test(result.learned.guide)) result.errors.push('learned run did not skip tutorial');
            if(result.learned.hype<1 || result.learned.scan<1 || result.learned.cash<1) result.errors.push('learned run missing full systems');
            if(result.scrollWidth>result.innerWidth) result.errors.push('horizontal overflow');
          }catch(e){result.errors.push(String(e));}
          fs.writeFileSync('/tmp/onboarding-memory-qa/review.json',JSON.stringify(result,null,2)); await b.close(); if(result.errors.length) process.exitCode=1;
          NODE
          node qa-onboarding-memory.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: prism-overdrive-onboarding-memory-qa, path: /tmp/onboarding-memory-qa, retention-days: 1}
      - name: Commit and cleanup
        if: success()
        run: |
          rm -f scripts/pass-overdrive-onboarding-memory.py .github/workflows/pass-overdrive-onboarding-memory.yml qa-onboarding-memory.mjs
          git config user.name yz4git
          git config user.email 65384484+yz4git@users.noreply.github.com
          git add app/PrismOverdrive.tsx app/PrismOverdrive.module.css scripts .github/workflows
          git commit -m 'Remember Prism Overdrive onboarding progress'
          git push origin HEAD:main
