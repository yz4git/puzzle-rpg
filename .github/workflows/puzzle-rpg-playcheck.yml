name: Puzzle RPG Live Playcheck

# One browser install covers the full public gameplay regression suite, including CHECK/CONFRONT field actions.
on:
  workflow_run:
    workflows: ["Deploy Puzzle RPG to GitHub Pages"]
    types: [completed]
  push:
    paths:
      - scripts/live-playcheck.mjs
      - .github/workflows/puzzle-rpg-playcheck.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PLAYCHECK_URL: https://yz4git.github.io/puzzle-rpg/
  PLAYCHECK_OUTPUT: ${{ github.workspace }}/playcheck-artifacts

jobs:
  playcheck:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install one isolated Playwright browser
        run: |
          mkdir -p /tmp/puzzle-rpg-playcheck
          cd /tmp/puzzle-rpg-playcheck
          npm init -y
          npm install --no-audit --no-fund playwright@latest
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/scripts/live-playcheck.mjs" ./live-playcheck.mjs

      - name: Run comprehensive iPhone-sized public Pages playcheck
        run: |
          cd /tmp/puzzle-rpg-playcheck
          node live-playcheck.mjs

      - name: Upload playcheck screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-rpg-live-playcheck
          path: playcheck-artifacts
          retention-days: 2