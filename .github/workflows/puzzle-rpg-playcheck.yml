name: Puzzle RPG Live Playcheck

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/puzzle-rpg-playcheck.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PLAYCHECK_URL: https://yz4git.github.io/puzzle-rpg/

jobs:
  playcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: |
          npm install --no-save --package-lock=false playwright@latest
          npx playwright install --with-deps chromium

      - name: Run iPhone-sized live playcheck
        run: |
          mkdir -p playcheck-artifacts
          cat > /tmp/puzzle-rpg-playcheck.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const url = process.env.PLAYCHECK_URL;
          const report = { url, startedAt: new Date().toISOString(), scenes: [], consoleErrors: [], pageErrors: [], failedResponses: [] };
          const browser = await chromium.launch({ headless: true });

          async function makePage() {
            const context = await browser.newContext({
              viewport: { width: 393, height: 852 },
              screen: { width: 393, height: 852 },
              deviceScaleFactor: 2,
              isMobile: true,
              hasTouch: true,
              locale: 'ja-JP',
              colorScheme: 'dark',
            });
            const page = await context.newPage();
            page.on('console', msg => { if (msg.type() === 'error') report.consoleErrors.push(msg.text()); });
            page.on('pageerror', err => report.pageErrors.push(String(err)));
            page.on('response', res => { if (res.status() >= 400) report.failedResponses.push({ status: res.status(), url: res.url() }); });
            return { context, page };
          }

          async function snapshot(page, name) {
            await page.waitForTimeout(700);
            const metrics = await page.evaluate(() => {
              const buttons = [...document.querySelectorAll('button')].filter(el => {
                const s = getComputedStyle(el); return s.visibility !== 'hidden' && s.display !== 'none';
              });
              const interactive = buttons.map((el, index) => {
                const r = el.getBoundingClientRect();
                return {
                  index,
                  text: (el.innerText || el.getAttribute('aria-label') || '').replace(/\s+/g, ' ').trim().slice(0, 120),
                  x: Math.round(r.x), y: Math.round(r.y), width: Math.round(r.width), height: Math.round(r.height),
                  inViewport: r.bottom > 0 && r.top < innerHeight && r.right > 0 && r.left < innerWidth,
                };
              });
              const all = [...document.querySelectorAll('body *')];
              const overflow = all.map(el => {
                const r = el.getBoundingClientRect();
                return { tag: el.tagName, cls: typeof el.className === 'string' ? el.className : '', x: r.x, right: r.right, width: r.width };
              }).filter(v => v.width > 1 && (v.x < -2 || v.right > innerWidth + 2)).slice(0, 40);
              return {
                title: document.title,
                bodyText: document.body.innerText.replace(/\s+/g, ' ').slice(0, 4000),
                viewport: { width: innerWidth, height: innerHeight },
                document: { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight },
                buttons: interactive,
                overflow,
              };
            });
            report.scenes.push({ name, ...metrics });
            await page.screenshot({ path: `playcheck-artifacts/${name}.png`, fullPage: true });
          }

          // Title -> RPG Mode -> New Game -> a few movement/control taps.
          {
            const { context, page } = await makePage();
            await page.goto(`${url}?live_playcheck=${Date.now()}`, { waitUntil: 'networkidle', timeout: 60000 });
            await snapshot(page, '01-title');
            await page.getByRole('button', { name: /RPG MODE/i }).click();
            await snapshot(page, '02-rpg-choice');
            await page.getByRole('button', { name: /NEW GAME/i }).click();
            await snapshot(page, '03-rpg-world');

            // Exercise visible virtual controls without assuming implementation-specific class names.
            const visibleButtons = page.locator('button:visible');
            const count = await visibleButtons.count();
            for (let i = 0; i < Math.min(count, 12); i++) {
              const b = visibleButtons.nth(i);
              const text = ((await b.innerText().catch(() => '')) || (await b.getAttribute('aria-label').catch(() => '')) || '').trim();
              if (/^(↑|↓|←|→|A|B|UP|DOWN|LEFT|RIGHT)$/i.test(text)) {
                await b.click({ trial: false }).catch(() => {});
                await page.waitForTimeout(120);
              }
            }
            await snapshot(page, '04-rpg-after-controls');
            await context.close();
          }

          // Fresh title -> Chapter Battle -> interact with likely board buttons.
          {
            const { context, page } = await makePage();
            await page.goto(`${url}?chapter_playcheck=${Date.now()}`, { waitUntil: 'networkidle', timeout: 60000 });
            await page.getByRole('button', { name: /CHAPTER BATTLE/i }).click();
            await snapshot(page, '05-chapter-battle');

            const candidates = page.locator('button:visible');
            const count = await candidates.count();
            for (let i = 0; i < count; i++) {
              const b = candidates.nth(i);
              const box = await b.boundingBox().catch(() => null);
              if (!box) continue;
              // Prefer square-ish board cells near the middle of the phone screen.
              if (box.width >= 32 && box.width <= 85 && box.height >= 32 && box.height <= 85 && box.y > 230 && box.y < 720) {
                await b.click().catch(() => {});
                await page.waitForTimeout(500);
                break;
              }
            }
            await snapshot(page, '06-chapter-after-move');
            await context.close();
          }

          report.finishedAt = new Date().toISOString();
          await writeFile('playcheck-artifacts/report.json', JSON.stringify(report, null, 2));
          await browser.close();

          if (report.pageErrors.length || report.failedResponses.some(r => r.status >= 500)) {
            console.error(JSON.stringify(report, null, 2));
            process.exitCode = 1;
          } else {
            console.log(JSON.stringify(report, null, 2));
          }
          EOF
          node /tmp/puzzle-rpg-playcheck.mjs

      - name: Upload playcheck screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-rpg-live-playcheck
          path: playcheck-artifacts
          retention-days: 2
