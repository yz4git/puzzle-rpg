name: Puzzle RPG Live Playcheck

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/puzzle-rpg-playcheck.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PLAYCHECK_URL: https://yz4git.github.io/puzzle-rpg/

jobs:
  playcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install isolated Playwright browser
        run: |
          mkdir -p /tmp/playcheck-runner
          cd /tmp/playcheck-runner
          npm init -y
          npm install --no-audit --no-fund playwright@latest
          npx playwright install --with-deps chromium

      - name: Run iPhone-sized live playcheck
        run: |
          mkdir -p "$GITHUB_WORKSPACE/playcheck-artifacts"
          cat > /tmp/playcheck-runner/playcheck.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          import path from 'node:path';

          const url = process.env.PLAYCHECK_URL;
          const outputDir = path.join(process.env.GITHUB_WORKSPACE, 'playcheck-artifacts');
          const report = { url, startedAt: new Date().toISOString(), scenes: [], consoleErrors: [], pageErrors: [], failedResponses: [] };
          const browser = await chromium.launch({ headless: true });

          async function makePage() {
            const context = await browser.newContext({
              viewport: { width: 393, height: 852 },
              screen: { width: 393, height: 852 },
              deviceScaleFactor: 2,
              isMobile: true,
              hasTouch: true,
              locale: 'ja-JP',
              colorScheme: 'dark',
            });
            const page = await context.newPage();
            page.on('console', msg => { if (msg.type() === 'error') report.consoleErrors.push(msg.text()); });
            page.on('pageerror', err => report.pageErrors.push(String(err)));
            page.on('response', res => { if (res.status() >= 400) report.failedResponses.push({ status: res.status(), url: res.url() }); });
            return { context, page };
          }

          async function snapshot(page, name) {
            await page.waitForTimeout(700);
            const metrics = await page.evaluate(() => {
              const buttons = [...document.querySelectorAll('button')].filter(el => {
                const s = getComputedStyle(el); return s.visibility !== 'hidden' && s.display !== 'none';
              });
              const interactive = buttons.map((el, index) => {
                const r = el.getBoundingClientRect();
                return {
                  index,
                  text: (el.innerText || el.getAttribute('aria-label') || '').replace(/\s+/g, ' ').trim().slice(0, 120),
                  aria: el.getAttribute('aria-label') || '',
                  x: Math.round(r.x), y: Math.round(r.y), width: Math.round(r.width), height: Math.round(r.height),
                  inViewport: r.bottom > 0 && r.top < innerHeight && r.right > 0 && r.left < innerWidth,
                };
              });
              const all = [...document.querySelectorAll('body *')];
              const overflow = all.map(el => {
                const r = el.getBoundingClientRect();
                return { tag: el.tagName, cls: typeof el.className === 'string' ? el.className : '', x: Math.round(r.x), right: Math.round(r.right), width: Math.round(r.width) };
              }).filter(v => v.width > 1 && (v.x < -2 || v.right > innerWidth + 2)).slice(0, 40);
              const tinyButtons = interactive.filter(b => b.width < 44 || b.height < 44);
              return {
                title: document.title,
                bodyText: document.body.innerText.replace(/\s+/g, ' ').slice(0, 4000),
                viewport: { width: innerWidth, height: innerHeight },
                document: { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight },
                buttons: interactive,
                tinyButtons,
                overflow,
              };
            });
            report.scenes.push({ name, ...metrics });
            await page.screenshot({ path: path.join(outputDir, `${name}.png`), fullPage: true });
          }

          // Title -> RPG Mode -> New Game -> movement and action controls.
          {
            const { context, page } = await makePage();
            await page.goto(`${url}?live_playcheck=${Date.now()}`, { waitUntil: 'networkidle', timeout: 60000 });
            await snapshot(page, '01-title');
            await page.getByRole('button', { name: /RPG MODE/i }).click();
            await snapshot(page, '02-rpg-choice');
            await page.getByRole('button', { name: /NEW GAME/i }).click();
            await snapshot(page, '03-rpg-world');

            for (const label of ['Move up', 'Move right', 'Move down', 'Move left']) {
              const control = page.getByRole('button', { name: label });
              if (await control.count()) {
                await control.dispatchEvent('pointerdown', { pointerId: 1, pointerType: 'touch', isPrimary: true });
                await page.waitForTimeout(90);
                await control.dispatchEvent('pointerup', { pointerId: 1, pointerType: 'touch', isPrimary: true });
                await page.waitForTimeout(120);
              }
            }
            const a = page.getByRole('button', { name: /A\s*CHECK/i });
            if (await a.count()) {
              await a.dispatchEvent('pointerdown', { pointerId: 2, pointerType: 'touch', isPrimary: true }).catch(() => {});
              await page.waitForTimeout(100);
              await a.dispatchEvent('pointerup', { pointerId: 2, pointerType: 'touch', isPrimary: true }).catch(() => {});
            }
            await snapshot(page, '04-rpg-after-controls');
            await context.close();
          }

          // Fresh title -> Chapter Battle -> interact with one board cell.
          {
            const { context, page } = await makePage();
            await page.goto(`${url}?chapter_playcheck=${Date.now()}`, { waitUntil: 'networkidle', timeout: 60000 });
            await page.getByRole('button', { name: /CHAPTER BATTLE/i }).click();
            await snapshot(page, '05-chapter-battle');

            const candidates = page.locator('button:visible');
            const count = await candidates.count();
            for (let i = 0; i < count; i++) {
              const b = candidates.nth(i);
              const box = await b.boundingBox().catch(() => null);
              if (!box) continue;
              if (box.width >= 32 && box.width <= 85 && box.height >= 32 && box.height <= 85 && box.y > 220 && box.y < 720) {
                await b.click().catch(() => {});
                await page.waitForTimeout(650);
                break;
              }
            }
            await snapshot(page, '06-chapter-after-move');
            await context.close();
          }

          report.finishedAt = new Date().toISOString();
          await writeFile(path.join(outputDir, 'report.json'), JSON.stringify(report, null, 2));
          await browser.close();

          console.log(JSON.stringify(report, null, 2));
          if (report.pageErrors.length || report.failedResponses.some(r => r.status >= 500)) process.exitCode = 1;
          EOF
          cd /tmp/playcheck-runner
          node playcheck.mjs

      - name: Upload playcheck screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-rpg-live-playcheck
          path: playcheck-artifacts
          retention-days: 2
