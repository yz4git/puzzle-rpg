name: SFC Visual Audit 7C
on:
  push:
    branches: [review/sfc-visual-audit7c-20260828]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start review server
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/puzzle-rpg-sfc7c.log 2>&1 &
          for i in $(seq 1 80); do if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi; sleep 0.25; done
          cat /tmp/puzzle-rpg-sfc7c.log; exit 1
      - run: node scripts/sfc-visual-audit7c.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: puzzle-rpg-sfc-visual-audit7c
          path: sfc-visual-audit7c
