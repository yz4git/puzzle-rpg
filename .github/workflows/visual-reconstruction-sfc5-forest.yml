name: SFC Visual Reconstruction Pass 5 Forest
on:
  push:
    branches: [visual/reconstruction-pass-sfc5]
    paths:
      - scripts/apply-sfc-visual-pass5-forest-metatile.py
      - .github/workflows/visual-reconstruction-sfc5-forest.yml
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/reconstruction-pass-sfc5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply forest metatile correction
        run: python scripts/apply-sfc-visual-pass5-forest-metatile.py
      - name: Puzzle RPG TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Review diff
        run: |
          git diff --check
          git status --short
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rpg/RPGMode.tsx PROGRESS.md
          git commit -m "Use forest metatiles in SFC visual pass 5"
          git push origin HEAD:visual/reconstruction-pass-sfc5
