name: Apply Skip Stopwatch and Shield Feedback
on:
  push:
    branches: [main]
    paths:
      - 'scripts/implement-skip-shield-feedback.py'
      - '.github/workflows/apply-skip-shield-feedback.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply battle feedback pass
        run: python scripts/implement-skip-shield-feedback.py
      - name: Install dependencies
        run: npm ci
      - name: Puzzle RPG TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Commit battle feedback pass
        run: |
          rm scripts/implement-skip-shield-feedback.py
          rm .github/workflows/apply-skip-shield-feedback.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/rpg/RPGPuzzleBattle.tsx app/rpg/RPGPuzzleBattle.module.css PROGRESS.md scripts/implement-skip-shield-feedback.py .github/workflows/apply-skip-shield-feedback.yml
          git commit -m 'Improve skip and barrier battle feedback'
          git push origin HEAD:main
