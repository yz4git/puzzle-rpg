name: SFC Visual Reconstruction Pass 6 Natural Ridge
on:
  push:
    branches: [visual/reconstruction-pass-sfc6]
    paths:
      - scripts/apply-sfc-visual-pass6-ridge-natural.py
      - .github/workflows/visual-reconstruction-sfc6-ridge-natural.yml
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/reconstruction-pass-sfc6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/apply-sfc-visual-pass6-ridge-natural.py
      - run: npx tsc -p tsconfig.puzzle.json --noEmit
      - run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - run: git diff --check
      - name: Commit natural ridge correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rpg/RPGMode.tsx PROGRESS.md
          git diff --cached --quiet && exit 0
          git commit -m "Naturalize mountain ridges in SFC visual pass 6"
          git push origin HEAD:visual/reconstruction-pass-sfc6
