name: Compress Stopwatch QA Images
on:
  push:
    paths:
      - '.github/workflows/compress-stopwatch-qa.yml'
jobs:
  compress:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Make compact inspection copies
        run: |
          ffmpeg -y -loglevel error -i qa-stopwatch-armed.jpg -vf scale=260:-1 -q:v 15 /tmp/armed-small.jpg
          ffmpeg -y -loglevel error -i qa-stopwatch-zero.jpg -vf scale=260:-1 -q:v 15 /tmp/zero-small.jpg
          base64 -w0 /tmp/armed-small.jpg > qa-stopwatch-armed-small.b64
          base64 -w0 /tmp/zero-small.jpg > qa-stopwatch-zero-small.b64
          wc -c qa-stopwatch-armed-small.b64 qa-stopwatch-zero-small.b64
          rm .github/workflows/compress-stopwatch-qa.yml
      - name: Commit compact payloads
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add compact stopwatch QA inspection payloads'
          git push origin main
