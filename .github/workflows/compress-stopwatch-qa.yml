name: Compress Stopwatch QA Images
on:
  push:
    paths:
      - '.github/workflows/compress-stopwatch-qa.yml'
jobs:
  compress:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install --user pillow
      - name: Make compact inspection copies
        run: |
          python3 - <<'PY'
          from PIL import Image
          for src, dst in [('qa-stopwatch-armed.jpg','/tmp/armed-small.jpg'),('qa-stopwatch-zero.jpg','/tmp/zero-small.jpg')]:
              im = Image.open(src).convert('RGB')
              h = round(im.height * 260 / im.width)
              im.resize((260,h), Image.Resampling.LANCZOS).save(dst, quality=35, optimize=True)
          PY
          base64 -w0 /tmp/armed-small.jpg > qa-stopwatch-armed-small.b64
          base64 -w0 /tmp/zero-small.jpg > qa-stopwatch-zero-small.b64
          wc -c qa-stopwatch-armed-small.b64 qa-stopwatch-zero-small.b64
          rm .github/workflows/compress-stopwatch-qa.yml
      - name: Commit compact payloads
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add compact stopwatch QA inspection payloads'
          git push origin main
