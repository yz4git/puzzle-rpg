name: SFC Pass 18 Impact

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pass18-impact.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply impact pass
        run: python scripts/pass18_patch.py
      - name: Commit pass
        shell: bash
        run: |
          rm .github/workflows/pass18-impact.yml scripts/pass18_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rpg/RPGPuzzleBattle.tsx app/rpg/RPGPuzzleBattle.module.css PROGRESS.md .github/workflows/pass18-impact.yml scripts/pass18_patch.py
          git commit -m "Implement SFC visual reconstruction pass 18"
          git push origin HEAD:main
