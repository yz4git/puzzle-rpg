name: SFC Pass 18 Impact

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pass18-impact.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply impact pass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tsx_path = Path('app/rpg/RPGPuzzleBattle.tsx')
          css_path = Path('app/rpg/RPGPuzzleBattle.module.css')
          progress_path = Path('PROGRESS.md')
          tsx = tsx_path.read_text()

          def swap(old: str, new: str):
              global tsx
              if old not in tsx:
                  raise SystemExit(f'missing TSX anchor: {old[:90]!r}')
              tsx = tsx.replace(old, new, 1)

          swap(
              'type TrainingBrief = { school: PanelType; technique: TechniqueId; objective: string };\n',
              'type TrainingBrief = { school: PanelType; technique: TechniqueId; objective: string };\n'
              'type BattleImpact = "enemyHit" | "playerHit" | "heal" | "barrier" | "block" | "phase" | "release" | "skill" | "item" | null;\n'
          )
          swap(
              '  const [feedback, setFeedback] = useState("");\n  const [talkOverlay, setTalkOverlay] = useState<{ speaker: string; text: string } | null>(null);\n  const finished = useRef(false);\n',
              '  const [feedback, setFeedback] = useState("");\n  const [impact, setImpact] = useState<BattleImpact>(null);\n  const [talkOverlay, setTalkOverlay] = useState<{ speaker: string; text: string } | null>(null);\n  const finished = useRef(false);\n  const feedbackSeq = useRef(0);\n'
          )
          swap(
              '  function showEffect(text: string) {\n    setFeedback(text);\n    window.setTimeout(() => setFeedback((current) => current === text ? "" : current), 620);\n  }\n',
              '  function showEffect(text: string, kind: BattleImpact = "skill", duration = 620) {\n    feedbackSeq.current += 1;\n    const seq = feedbackSeq.current;\n    setFeedback(text);\n    setImpact(kind);\n    window.setTimeout(() => {\n      if (feedbackSeq.current !== seq) return;\n      setFeedback("");\n      setImpact(null);\n    }, duration);\n  }\n'
          )
          swap('      showEffect(`-${damage}`);', '      showEffect(`-${damage}`, "enemyHit");')
          swap('      showEffect(`+${gain} HP`); playSfx("heal");', '      showEffect(`+${gain} HP`, "heal"); playSfx("heal");')
          swap('      setBarrier(nextBarrier); setMessage(`BAR×${count} → BAR +${gain}`); showEffect(`+${gain} BAR`); playSfx("shield");', '      setBarrier(nextBarrier); setMessage(`BAR×${count} → BAR +${gain}`); showEffect(`+${gain} BAR`, "barrier"); playSfx("shield");')
          swap('    showEffect(damage > 0 ? `-${damage} HP` : "PERFECT BLOCK");', '    showEffect(damage > 0 ? `-${damage} HP` : "PERFECT BLOCK", damage > 0 ? "playerHit" : "block");')
          swap('      setMessage(enemy.conditionalTalk); showEffect("RELEASE");', '      setMessage(enemy.conditionalTalk); showEffect("RELEASE", "release", 760);')
          swap('    setHp(nextHp); setBarrier(nextBarrier); setFree(nextFree); setMessage(`${ITEMS[stack.id].name} USED`); showEffect(ITEMS[stack.id].description);', '    setHp(nextHp); setBarrier(nextBarrier); setFree(nextFree); setMessage(`${ITEMS[stack.id].name} USED`); showEffect(ITEMS[stack.id].description, "item");')
          swap(
              '      setPhase(nextPhase); setMessage(`${line} • ${nextPhase === 2 ? "PHASE II" : "FINAL PHASE"}`);\n      if (save.equipment.armor === "prismGuard") setBarrier((value) => Math.min(30, value + 2));',
              '      setPhase(nextPhase); setMessage(`${line} • ${nextPhase === 2 ? "PHASE II" : "FINAL PHASE"}`);\n      showEffect(nextPhase === 2 ? "PHASE II" : "FINAL PHASE", "phase", 760);\n      if (save.equipment.armor === "prismGuard") setBarrier((value) => Math.min(30, value + 2));'
          )
          swap(
              '  const enemyFrame: EnemySpriteFrame = talkOverlay\n    ? "reaction"\n    : phase > 1\n      ? "phase"\n    : feedback.includes("HP")\n      ? "attack"\n      : feedback.startsWith("-")\n        ? "hurt"\n        : feedback\n          ? "reaction"\n          : "idle";\n',
              '  const enemyFrame: EnemySpriteFrame = talkOverlay\n    ? "reaction"\n    : impact === "enemyHit"\n      ? "hurt"\n      : impact === "playerHit"\n        ? "attack"\n        : impact === "phase" || phase > 1\n          ? "phase"\n          : feedback\n            ? "reaction"\n            : "idle";\n'
          )
          swap(
              '    <main className={styles.battle} data-enemy={enemy.portrait} data-boss={enemy.boss || training ? "true" : "false"} data-scene={battleScene(save.mapId)} data-talking={talkOverlay ? "true" : "false"}>',
              '    <main className={styles.battle} data-enemy={enemy.portrait} data-boss={enemy.boss || training ? "true" : "false"} data-scene={battleScene(save.mapId)} data-talking={talkOverlay ? "true" : "false"} data-impact={impact ?? "none"}>'
          )
          swap(
              '      <div className={styles.battleBackdrop} aria-hidden="true"><i /><i /><i /></div>\n      {talkOverlay ? <div className={styles.talkMoment}><span>{talkOverlay.speaker}</span><p>{talkOverlay.text}</p><small>TALK</small></div> : null}\n      {feedback ? <div className={styles.feedback}>{feedback}</div> : null}',
              '      <div className={styles.battleBackdrop} aria-hidden="true"><i /><i /><i /></div>\n      <div className={styles.impactLayer} aria-hidden="true" />\n      {talkOverlay ? <div className={styles.talkMoment}><span>{talkOverlay.speaker}</span><p>{talkOverlay.text}</p><small>TALK</small></div> : null}\n      {feedback ? <div className={styles.feedback} data-kind={impact ?? "skill"}>{feedback}</div> : null}'
          )
          tsx_path.write_text(tsx)

          css = css_path.read_text()
          marker = '/* SFC visual reconstruction pass 18 — battle impact language */'
          if marker in css:
              raise SystemExit('pass 18 CSS already present')
          css += r'''

/* SFC visual reconstruction pass 18 — battle impact language */
.impactLayer{position:fixed;z-index:240;inset:0;pointer-events:none;opacity:0;overflow:hidden}.impactLayer::before,.impactLayer::after{content:"";position:absolute;pointer-events:none}.impactLayer::before{inset:0;background:transparent}.impactLayer::after{left:50%;top:24%;width:min(88vw,390px);height:4px;transform:translate(-50%,-50%);background:#fff;box-shadow:0 -8px transparent,0 8px transparent}
.battle[data-impact="enemyHit"] .impactLayer{animation:impactLayerEnemy 420ms steps(4,end) both}.battle[data-impact="enemyHit"] .impactLayer::before{background:linear-gradient(100deg,transparent 0 18%,rgba(255,244,188,.05) 18% 36%,rgba(255,132,57,.28) 36% 45%,rgba(255,255,255,.72) 45% 47%,rgba(255,132,57,.24) 47% 56%,transparent 56%)}.battle[data-impact="enemyHit"] .impactLayer::after{top:16%;height:3px;background:#fff2a5;box-shadow:0 -10px #ff8a39,0 10px #ff8a39;transform:translate(-52%,-50%) rotate(-6deg)}
.battle[data-impact="playerHit"] .impactLayer{animation:impactLayerPlayer 500ms steps(5,end) both}.battle[data-impact="playerHit"] .impactLayer::before{background:linear-gradient(90deg,rgba(255,40,62,.22),transparent 21% 79%,rgba(255,40,62,.22)),repeating-linear-gradient(135deg,transparent 0 22px,rgba(255,245,231,.1) 23px 25px,transparent 26px 44px)}.battle[data-impact="playerHit"] .impactLayer::after{top:27%;width:min(94vw,420px);height:2px;background:#ff5d69;box-shadow:0 -7px rgba(255,255,255,.7),0 7px rgba(255,61,72,.7)}
.battle[data-impact="heal"] .impactLayer{animation:impactLayerHeal 520ms steps(5,end) both}.battle[data-impact="heal"] .impactLayer::before{inset:18% 7% auto;height:64px;background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(117,255,173,.16) 18px 21px,transparent 21px 39px)}.battle[data-impact="heal"] .impactLayer::after{top:27%;width:120px;height:3px;background:#a6ffd0;box-shadow:0 -12px #6effa8,0 12px #6effa8}
.battle[data-impact="barrier"] .impactLayer{animation:impactLayerBarrier 540ms steps(5,end) both}.battle[data-impact="barrier"] .impactLayer::before{left:50%;top:27%;width:150px;height:58px;transform:translate(-50%,-50%);border:3px solid rgba(122,235,255,.8);box-shadow:inset 0 0 0 3px rgba(44,139,165,.55),0 0 0 3px rgba(4,8,12,.75);clip-path:polygon(12% 0,88% 0,100% 24%,92% 100%,8% 100%,0 24%)}.battle[data-impact="barrier"] .impactLayer::after{display:none}
.battle[data-impact="block"] .impactLayer{animation:impactLayerBlock 520ms steps(5,end) both}.battle[data-impact="block"] .impactLayer::before{left:50%;top:27%;width:190px;height:70px;transform:translate(-50%,-50%);border:4px double #eafcff;background:rgba(76,202,232,.08);clip-path:polygon(16% 0,84% 0,100% 30%,88% 100%,12% 100%,0 30%)}.battle[data-impact="block"] .impactLayer::after{top:27%;width:150px;height:3px;background:#fff;box-shadow:0 -13px #7cecff,0 13px #7cecff}
.battle[data-impact="phase"] .impactLayer{animation:impactLayerPhase 760ms steps(7,end) both}.battle[data-impact="phase"] .impactLayer::before{background:repeating-linear-gradient(90deg,transparent 0 25px,color-mix(in srgb,var(--sceneAccent) 24%,transparent) 26px 31px,transparent 32px 58px),linear-gradient(180deg,rgba(255,255,255,.38),transparent 18% 80%,rgba(255,224,130,.18))}.battle[data-impact="phase"] .impactLayer::after{top:19%;width:min(94vw,420px);height:4px;background:var(--sceneAccent);box-shadow:0 -14px #fff7d5,0 14px #fff7d5}
.battle[data-impact="release"] .impactLayer{animation:impactLayerRelease 760ms steps(6,end) both}.battle[data-impact="release"] .impactLayer::before{background:radial-gradient(circle at 50% 18%,rgba(255,245,190,.44),rgba(255,239,140,.08) 24%,transparent 46%)}.battle[data-impact="release"] .impactLayer::after{top:18%;width:96px;height:2px;background:#fff7bd;box-shadow:0 -15px #ffe57a,0 15px #ffe57a}
.feedback{z-index:250;white-space:nowrap}.feedback[data-kind="enemyHit"]{top:clamp(92px,16dvh,122px);border-color:#ffb45c;background:#170a05;color:#fff3a5;font-size:20px;animation:enemyDamagePop 620ms steps(5,end) both}.feedback[data-kind="playerHit"]{top:clamp(145px,25dvh,185px);border-color:#ff6b79;background:#1a070b;color:#fff0e6;font-size:19px;animation:playerDamagePop 620ms steps(5,end) both}.feedback[data-kind="heal"]{top:clamp(145px,25dvh,185px);border-color:#7cffb2;background:#06150d;color:#baffd3;font-size:17px;animation:statusGainPop 620ms steps(5,end) both}.feedback[data-kind="barrier"]{top:clamp(145px,25dvh,185px);border-color:#7cecff;background:#061319;color:#bff6ff;font-size:17px;animation:statusGainPop 620ms steps(5,end) both}.feedback[data-kind="block"]{top:clamp(145px,25dvh,185px);border-color:#e8fbff;background:#07151b;color:#d9fbff;font-size:16px;letter-spacing:.04em;animation:blockPop 620ms steps(5,end) both}.feedback[data-kind="phase"]{top:clamp(112px,20dvh,150px);border-color:#fff6c7;background:#09070d;color:#fff0a0;font-size:20px;letter-spacing:.12em;box-shadow:0 0 0 2px #000,0 0 0 5px var(--sceneAccent),6px 6px #000;animation:phasePop 760ms steps(7,end) both}.feedback[data-kind="release"]{top:clamp(98px,18dvh,138px);border-color:#fff4b5;background:#111007;color:#fff3b0;font-size:18px;letter-spacing:.12em;animation:releasePop 760ms steps(6,end) both}.feedback[data-kind="item"]{border-color:color-mix(in srgb,var(--sceneAccent) 58%,#fff);font-size:12px;max-width:min(92vw,390px);white-space:normal;text-align:center;line-height:1.25}
.battle[data-impact="enemyHit"] .enemyRow{animation:enemyRowHit 420ms steps(5,end) both}.battle[data-impact="playerHit"] .statusRow>div:first-child{animation:hpMeterHit 500ms steps(5,end) both}.battle[data-impact="heal"] .statusRow>div:first-child{animation:statusMeterGain 520ms steps(5,end) both}.battle[data-impact="barrier"] .statusRow>div:nth-child(2){animation:statusMeterBarrier 540ms steps(5,end) both}.battle[data-impact="block"] .statusRow>div:nth-child(2){animation:statusMeterBlock 520ms steps(5,end) both}.battle[data-impact="phase"] .enemyRow,.battle[data-impact="phase"] .header{animation:phaseFramePulse 760ms steps(7,end) both}.battle[data-impact="phase"] .battleBackdrop{animation:phaseBackdrop 760ms steps(7,end) both}.battle[data-impact="release"] .enemyRow{animation:releaseEnemy 760ms steps(6,end) both}
@keyframes impactLayerEnemy{0%{opacity:0}12%{opacity:1}38%{opacity:.82}58%{opacity:.18}100%{opacity:0}}@keyframes impactLayerPlayer{0%{opacity:0}10%{opacity:1}26%{opacity:.72}52%{opacity:.28}100%{opacity:0}}@keyframes impactLayerHeal{0%{opacity:0}15%{opacity:.9}55%{opacity:.42}100%{opacity:0}}@keyframes impactLayerBarrier{0%{opacity:0}16%{opacity:1}48%{opacity:.62}100%{opacity:0}}@keyframes impactLayerBlock{0%{opacity:0}12%{opacity:1}32%{opacity:.76}60%{opacity:.34}100%{opacity:0}}@keyframes impactLayerPhase{0%{opacity:0}8%{opacity:1}18%{opacity:.18}30%{opacity:.92}48%{opacity:.35}68%{opacity:.72}100%{opacity:0}}@keyframes impactLayerRelease{0%{opacity:0}18%{opacity:.92}56%{opacity:.48}100%{opacity:0}}
@keyframes enemyDamagePop{0%{opacity:0;transform:translate(-42%,-45%) scale(.7)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}44%{transform:translate(-52%,-50%) scale(.98)}72%{opacity:1;transform:translate(-50%,-56%) scale(1)}100%{opacity:0;transform:translate(-50%,-88%) scale(.86)}}@keyframes playerDamagePop{0%{opacity:0;transform:translate(-50%,-30%) scale(.72)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}36%{transform:translate(-53%,-50%) scale(1)}54%{transform:translate(-47%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-78%) scale(.9)}}@keyframes statusGainPop{0%{opacity:0;transform:translate(-50%,-20%) scale(.78)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.14)}66%{opacity:1;transform:translate(-50%,-55%) scale(1)}100%{opacity:0;transform:translate(-50%,-88%) scale(.92)}}@keyframes blockPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.65)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.16)}44%{transform:translate(-50%,-50%) scale(.98)}72%{opacity:1}100%{opacity:0;transform:translate(-50%,-65%) scale(1.02)}}@keyframes phasePop{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}30%{transform:translate(-50%,-50%) scale(.94)}48%{transform:translate(-50%,-50%) scale(1.05)}72%{opacity:1}100%{opacity:0;transform:translate(-50%,-58%) scale(1)}}@keyframes releasePop{0%{opacity:0;transform:translate(-50%,-35%) scale(.7)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.14)}68%{opacity:1;transform:translate(-50%,-58%) scale(1)}100%{opacity:0;transform:translate(-50%,-86%) scale(.9)}}
@keyframes enemyRowHit{0%{transform:translateX(0);filter:brightness(1)}16%{transform:translateX(5px);filter:brightness(1.8)}32%{transform:translateX(-4px)}50%{transform:translateX(2px);filter:brightness(1.22)}70%{transform:translateX(-1px)}100%{transform:translateX(0);filter:brightness(1)}}@keyframes hpMeterHit{0%{transform:translateX(0)}18%{transform:translateX(-3px);filter:brightness(1.8)}36%{transform:translateX(3px)}58%{transform:translateX(-1px);filter:brightness(1.15)}100%{transform:translateX(0);filter:none}}@keyframes statusMeterGain{0%{filter:brightness(1)}22%{filter:brightness(2);box-shadow:inset 0 0 0 2px #a6ffd0}58%{filter:brightness(1.25)}100%{filter:none}}@keyframes statusMeterBarrier{0%{filter:brightness(1)}22%{filter:brightness(2);box-shadow:inset 0 0 0 2px #a6f2ff}58%{filter:brightness(1.25)}100%{filter:none}}@keyframes statusMeterBlock{0%{transform:scale(1)}18%{transform:scale(1.04);filter:brightness(2)}44%{transform:scale(.99)}70%{filter:brightness(1.25)}100%{transform:scale(1);filter:none}}@keyframes phaseFramePulse{0%{filter:brightness(1)}14%{filter:brightness(2)}28%{filter:brightness(.72)}48%{filter:brightness(1.65)}68%{filter:brightness(.9)}100%{filter:none}}@keyframes phaseBackdrop{0%{filter:brightness(1) saturate(1)}18%{filter:brightness(2) saturate(.3)}36%{filter:brightness(.7) saturate(1.5)}62%{filter:brightness(1.45) saturate(1.2)}100%{filter:none}}@keyframes releaseEnemy{0%{filter:brightness(1)}20%{filter:brightness(1.8) saturate(.7)}60%{filter:brightness(1.25) saturate(.45)}100%{filter:none}}
@media(max-height:700px){.feedback[data-kind="enemyHit"]{top:86px}.feedback[data-kind="playerHit"],.feedback[data-kind="heal"],.feedback[data-kind="barrier"],.feedback[data-kind="block"]{top:142px}.feedback[data-kind="phase"]{top:104px}.feedback[data-kind="release"]{top:92px}}
@media(prefers-reduced-motion:reduce){.impactLayer,.feedback,.enemyRow,.statusRow>div,.header,.battleBackdrop{animation-duration:1ms!important;animation-iteration-count:1!important}}
'''
          css_path.write_text(css)

          progress = progress_path.read_text()
          block = '''\n\n## SFC Visual Reconstruction Pass 18 — Battle impact language\n- Split the generic battle feedback into explicit enemy-hit, player-hit, heal, barrier, perfect-block, boss-phase, release, skill and item impact states.\n- Added a fixed impact layer above the battle HUD/board and below dialogue/command overlays so attack effects can no longer disappear behind interface panels.\n- Added target-specific stepped shakes, meter flashes and phase/release screen accents while preserving the existing 620ms feedback cadence for normal actions.\n- Damage/heal/barrier values, enemy intents, turn order, collapse timing, battle rules, touch targets and Chapter Battle remain unchanged.\n'''
          if '## SFC Visual Reconstruction Pass 18 — Battle impact language' in progress:
              raise SystemExit('pass 18 progress already present')
          progress_path.write_text(progress.rstrip() + block + '\n')
          PY
          rm .github/workflows/pass18-impact.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rpg/RPGPuzzleBattle.tsx app/rpg/RPGPuzzleBattle.module.css PROGRESS.md .github/workflows/pass18-impact.yml
          git commit -m "Implement SFC visual reconstruction pass 18"
          git push origin HEAD:main
