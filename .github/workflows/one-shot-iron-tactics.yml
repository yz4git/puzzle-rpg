name: One-shot Iron Tyrant tactical pass

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-iron-tactics.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tactical counterplay patch
        run: python3 .github/one-shot-iron-tactics.py

      - name: Commit implementation and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rpg/RPGPuzzleBattle.tsx app/rpg/RPGMode.tsx app/rpg/RPGMode.module.css app/rpg/data/enemies.ts scripts/live-playcheck.mjs
          git rm .github/one-shot-iron-tactics.py .github/workflows/one-shot-iron-tactics.yml
          git commit -m "Make Iron Tyrant TALK create tactical guard counterplay"
          git push origin HEAD:main
