name: Implement Cluster Break v2

on:
  push:
    branches: [review/gameplay-audit-20260827-2]
    paths:
      - '.github/workflows/implement-cluster-break-v2.yml'
      - 'scripts/implement-cluster-break-v2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: review/gameplay-audit-20260827-2
          fetch-depth: 0
      - name: Preserve implementation script
        run: cp scripts/implement-cluster-break-v2.py /tmp/implement-cluster-break-v2.py
      - name: Switch to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Apply gameplay v2
        run: python /tmp/implement-cluster-break-v2.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Diff sanity
        run: git diff --check
      - name: Commit validated implementation
        run: |
          git config user.name 'yz4git'
          git config user.email '65384484+yz4git@users.noreply.github.com'
          git add app/PuzzleRPGClusterBreak.tsx app/PuzzleRPGGameplayV2.module.css
          git commit -m 'Implement tactical gameplay and feedback pass'
          git push origin HEAD:main
