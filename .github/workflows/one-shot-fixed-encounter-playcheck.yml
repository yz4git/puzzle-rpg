name: One-shot fixed encounter playcheck hardening

on:
  push:
    paths:
      - '.github/workflows/one-shot-fixed-encounter-playcheck.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden fixed encounter playcheck
        run: python3 scripts/one-shot-fixed-encounter-playcheck.py
      - name: Commit and clean helpers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-fixed-encounter-playcheck.yml scripts/one-shot-fixed-encounter-playcheck.py
          git add scripts/live-playcheck.mjs
          git commit -m 'Harden fixed encounter live playcheck'
          git push
