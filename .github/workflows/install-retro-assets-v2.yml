name: Install Retro Assets V2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-retro-assets-v2.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/integrate-retro-assets.py
      - run: npm ci
      - run: npx tsc -p tsconfig.puzzle.json --noEmit
      - run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Commit integration
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add app/PuzzleRPGGame.tsx app/PuzzleRPGGame.module.css
          git commit -m "Use 8-bit enemy sprites and chiptune SFX"
          git push
