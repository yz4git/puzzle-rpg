name: SFC Visual Reconstruction Pass 4

on:
  push:
    branches:
      - visual/reconstruction-pass-sfc4

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply pass 4
        run: python scripts/apply-sfc-visual-pass4.py
      - name: TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Vinext production build
        run: npx vinext build
      - name: Review diff
        run: |
          git status --short
          git diff --check
          git diff --stat
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rpg/RPGMode.tsx PROGRESS.md
          git commit -m "Implement SFC visual reconstruction pass 4"
          git push origin HEAD:visual/reconstruction-pass-sfc4
