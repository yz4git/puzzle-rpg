name: Endgame Balance

on:
  push:
    branches:
      - feature/endgame-balance-20260827

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/endgame-balance-20260827
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply endgame balance patch
        run: python3 scripts/implement-endgame-balance.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/PuzzleRPGClusterBreak.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Balance Chapter 1 endgame and boss phases"
          git push origin HEAD:feature/endgame-balance-20260827
