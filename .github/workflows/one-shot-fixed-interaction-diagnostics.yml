name: One-shot fixed interaction diagnostics

on:
  push:
    paths:
      - '.github/workflows/one-shot-fixed-interaction-diagnostics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add fixed battle state logging
        run: python3 scripts/patch-fixed-interaction-diagnostics.py
      - name: Commit diagnostics and clean runner
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-fixed-interaction-diagnostics.yml scripts/patch-fixed-interaction-diagnostics.py
          git add scripts/live-playcheck.mjs
          git commit -m 'Log fixed encounter interaction state in live QA'
          git push
