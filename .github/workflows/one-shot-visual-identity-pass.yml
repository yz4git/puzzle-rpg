name: One-shot RPG visual identity pass

on:
  push:
    paths:
      - '.github/workflows/one-shot-visual-identity-pass.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply visual identity pass
        shell: bash
        run: |
          python3 .github/visual-pass/patch.py
          cat .github/visual-pass/field.css >> app/rpg/RPGMode.module.css
          cat .github/visual-pass/battle.css >> app/rpg/RPGPuzzleBattle.module.css
      - name: Commit and clean helper files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-visual-identity-pass.yml
          git rm -r .github/visual-pass
          git add app/rpg/RPGMode.tsx app/rpg/RPGMode.module.css app/rpg/RPGPuzzleBattle.module.css
          git diff --cached --check
          git commit -m 'Remove RPG Maker visual language'
          git push origin HEAD:main
