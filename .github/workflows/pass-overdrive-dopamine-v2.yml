name: Prism Overdrive Dopamine Feedback Pass
on:
  push:
    paths:
      - 'scripts/pass-overdrive-dopamine-v2.py'
      - '.github/workflows/pass-overdrive-dopamine-v2.yml'
jobs:
  pass:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Apply dopamine feedback redesign
        run: python3 scripts/pass-overdrive-dopamine-v2.py
      - run: npm ci
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Browser QA setup
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install chromium
          bash scripts/sites-env.sh -- ./node_modules/.bin/vinext start --port 4173 >/tmp/overdrive-dopa-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
      - name: Board visibility gameplay QA
        run: |
          mkdir -p /tmp/overdrive-dopa-qa
          cat > qa-overdrive-dopa.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:402,height:874},deviceScaleFactor:1});
          const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
          await page.getByRole('button',{name:/PRISM OVERDRIVE/}).click();
          await page.getByRole('button',{name:/START OVERDRIVE/}).click();
          const board=page.locator('[aria-label="Prism Overdrive Cluster Break board"]');
          await board.waitFor();
          let feedSeen=false, cascadeSeen=false;
          for(let i=0;i<100;i++){
            const buttons=board.locator('button:not([disabled])');
            const n=await buttons.count();
            if(n){ await buttons.nth((i*11)%n).click(); await page.waitForTimeout(130); }
            const feed=page.locator('[class*="actionFeed"] [class*="actionFx"]');
            if(await feed.isVisible().catch(()=>false)){
              feedSeen=true;
              const box=await feed.boundingBox(); const b=await board.boundingBox();
              if(box && b && box.y < b.y+b.height) throw new Error('action feed overlaps board');
              const txt=await feed.innerText();
              if(!fs.existsSync('/tmp/overdrive-dopa-qa/action-feed.jpg')) await page.screenshot({path:'/tmp/overdrive-dopa-qa/action-feed.jpg',type:'jpeg',quality:90});
              if(txt.includes('AUTO CASCADE')){cascadeSeen=true; await page.screenshot({path:'/tmp/overdrive-dopa-qa/cascade-board.jpg',type:'jpeg',quality:90}); break;}
            }
            await page.waitForTimeout(760);
          }
          const result={errors,feedSeen,cascadeSeen,scrollWidth:await page.evaluate(()=>document.documentElement.scrollWidth),innerWidth:await page.evaluate(()=>innerWidth)};
          fs.writeFileSync('/tmp/overdrive-dopa-qa/review.json',JSON.stringify(result,null,2));
          if(errors.length) throw new Error(errors.join('\n'));
          if(!feedSeen) throw new Error('external action feed not observed');
          if(result.scrollWidth>result.innerWidth) throw new Error('horizontal overflow');
          await browser.close();
          NODE
          node qa-overdrive-dopa.mjs
          rm qa-overdrive-dopa.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: prism-overdrive-dopamine-qa
          path: /tmp/overdrive-dopa-qa
          retention-days: 1
      - name: Commit and cleanup
        run: |
          rm -f scripts/pass-overdrive-dopamine-v2.py .github/workflows/pass-overdrive-dopamine-v2.yml
          git config user.name 'yz4git'
          git config user.email '65384484+yz4git@users.noreply.github.com'
          git add app/PrismOverdrive.tsx app/PrismOverdrive.module.css app/gameAudio.ts scripts .github/workflows
          git commit -m 'Boost Prism Overdrive board-first dopamine feedback'
          git push origin HEAD:main
