name: Generated Pixel UI QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generated-pixel-ui-qa.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Visual check
        run: |
          cat > pixel-ui-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:402,height:874},isMobile:true,hasTouch:true,deviceScaleFactor:3});
          const errors=[];
          page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
          page.on('pageerror',e=>errors.push(e.message));
          fs.mkdirSync('qa-pixel-ui',{recursive:true});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          const hero = page.getByRole('img',{name:'Puzzle RPG hero'});
          await hero.waitFor({state:'visible'});
          await page.screenshot({path:'qa-pixel-ui/01-title.png'});
          const heroMetrics = await hero.evaluate(el=>({naturalWidth:el.naturalWidth,naturalHeight:el.naturalHeight,rect:el.getBoundingClientRect().toJSON()}));
          await page.getByRole('button',{name:'START GAME'}).click();
          await page.waitForTimeout(180);
          const introDialog = page.getByRole('dialog',{name:'Stage 1 briefing'});
          const introEnemy = introDialog.getByRole('img',{name:'Void Warden'});
          await introEnemy.waitFor({state:'visible'});
          await page.screenshot({path:'qa-pixel-ui/02-intro.png'});
          const introMetrics = await introEnemy.evaluate(el=>({naturalWidth:el.naturalWidth,naturalHeight:el.naturalHeight,rect:el.getBoundingClientRect().toJSON()}));
          const speech = await introDialog.locator('[class*=enemySpeech]').evaluate(el=>({text:el.textContent,rect:el.getBoundingClientRect().toJSON(),fontSize:getComputedStyle(el).fontSize,lineHeight:getComputedStyle(el).lineHeight}));
          await page.getByRole('button',{name:'BATTLE START'}).click();
          await page.waitForTimeout(180);
          await page.screenshot({path:'qa-pixel-ui/03-battle.png'});
          const battleEnemy = page.getByLabel('enemy status').getByRole('img',{name:'Void Warden'});
          const battleEnemyMetrics = await battleEnemy.evaluate(el=>({naturalWidth:el.naturalWidth,naturalHeight:el.naturalHeight,rect:el.getBoundingClientRect().toJSON()}));
          const board = await page.locator('[aria-label="puzzle board"]').boundingBox();
          const metrics = await page.evaluate(()=>({innerWidth,innerHeight,scrollY,scrollHeight:document.documentElement.scrollHeight,tiles:document.querySelectorAll('button[aria-label*=" orb row "]').length}));
          fs.writeFileSync('qa-pixel-ui/report.json',JSON.stringify({heroMetrics,introMetrics,speech,battleEnemyMetrics,board,metrics,errors},null,2));
          if(!heroMetrics.naturalWidth || !introMetrics.naturalWidth || !battleEnemyMetrics.naturalWidth) throw new Error('pixel sprite failed to load');
          if(metrics.tiles!==36) throw new Error(`expected 36 tiles, got ${metrics.tiles}`);
          if(errors.length) throw new Error(errors.join('\n'));
          await browser.close();
          JS
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/puzzle.log 2>&1 & PID=$!
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node pixel-ui-qa.mjs
          kill $PID || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-pixel-ui-qa
          path: qa-pixel-ui
