name: Apply generated orb UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply generated pixel orb presentation
        env:
          CSS_B64: 
        run: |
          if ! grep -q 'GENERATED_PIXEL_ORBS_V1' app/PuzzleRPGGame.module.css; then
            printf '%s' "$CSS_B64" | base64 -d >> app/PuzzleRPGGame.module.css
          fi
      - run: npm ci
      - run: npx tsc -p tsconfig.puzzle.json --noEmit
      - run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Commit presentation update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/PuzzleRPGGame.module.css
          git commit -m 'Use generated 8-bit orb icons across UI'
          git push origin HEAD:main
