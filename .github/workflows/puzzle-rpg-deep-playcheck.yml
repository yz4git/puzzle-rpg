name: Puzzle RPG Deep Live Playcheck

on:
  workflow_run:
    workflows: ["Deploy Puzzle RPG to GitHub Pages"]
    types: [completed]
  push:
    paths:
      - .github/workflows/puzzle-rpg-deep-playcheck.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PLAYCHECK_URL: https://yz4git.github.io/puzzle-rpg/

jobs:
  deep-playcheck:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install isolated Playwright browser
        run: |
          mkdir -p /tmp/puzzle-rpg-deep-check
          cd /tmp/puzzle-rpg-deep-check
          npm init -y
          npm install --no-audit --no-fund playwright@latest
          npx playwright install --with-deps chromium

      - name: Run field to RPG battle playcheck
        run: |
          mkdir -p "$GITHUB_WORKSPACE/deep-playcheck-artifacts"
          cat > /tmp/puzzle-rpg-deep-check/check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          import path from 'node:path';

          const url = process.env.PLAYCHECK_URL;
          const outputDir = path.join(process.env.GITHUB_WORKSPACE, 'deep-playcheck-artifacts');
          const report = { url, startedAt: new Date().toISOString(), scenes: [], assertions: [], consoleErrors: [], pageErrors: [], failedResponses: [] };
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 393, height: 852 }, screen: { width: 393, height: 852 },
            deviceScaleFactor: 2, isMobile: true, hasTouch: true, locale: 'ja-JP', colorScheme: 'dark',
          });
          const page = await context.newPage();
          page.on('console', msg => { if (msg.type() === 'error') report.consoleErrors.push(msg.text()); });
          page.on('pageerror', err => report.pageErrors.push(String(err)));
          page.on('response', res => { if (res.status() >= 400) report.failedResponses.push({ status: res.status(), url: res.url() }); });

          const assert = (name, pass, detail = {}) => report.assertions.push({ name, pass: Boolean(pass), ...detail });

          async function snapshot(name) {
            await page.waitForTimeout(420);
            const metrics = await page.evaluate(() => {
              const buttons = [...document.querySelectorAll('button')].filter(el => {
                const style = getComputedStyle(el);
                const r = el.getBoundingClientRect();
                return style.visibility !== 'hidden' && style.display !== 'none' && r.width > 0 && r.height > 0;
              }).map(el => {
                const r = el.getBoundingClientRect();
                return {
                  text: (el.innerText || el.getAttribute('aria-label') || '').replace(/\s+/g, ' ').trim().slice(0, 100),
                  aria: el.getAttribute('aria-label') || '', width: Math.round(r.width), height: Math.round(r.height),
                  x: Math.round(r.x), y: Math.round(r.y), inViewport: r.bottom > 0 && r.top < innerHeight && r.right > 0 && r.left < innerWidth,
                };
              });
              const overflow = [...document.querySelectorAll('body *')].map(el => {
                const r = el.getBoundingClientRect();
                return { tag: el.tagName, x: Math.round(r.x), right: Math.round(r.right), width: Math.round(r.width) };
              }).filter(v => v.width > 1 && (v.x < -2 || v.right > innerWidth + 2)).slice(0, 20);
              return {
                bodyText: document.body.innerText.replace(/\s+/g, ' ').slice(0, 7000),
                document: { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight },
                buttons, tinyButtons: buttons.filter(b => b.inViewport && (b.width < 44 || b.height < 44)), overflow,
              };
            });
            report.scenes.push({ name, ...metrics });
            await page.screenshot({ path: path.join(outputDir, `${name}.png`), fullPage: true });
            return metrics;
          }

          async function tapButton(name) {
            const button = page.getByRole('button', { name });
            if (!(await button.count())) return false;
            await button.first().tap({ force: true });
            await page.waitForTimeout(180);
            return true;
          }

          async function tapCluster() {
            const cells = page.locator('button[aria-label*=" row "][aria-label*=" column "]');
            const data = [];
            for (let i = 0; i < await cells.count(); i++) {
              const cell = cells.nth(i);
              const match = (await cell.getAttribute('aria-label'))?.match(/^(ATK|HEAL|BAR|SKIP) row (\d+) column (\d+)$/i);
              if (match) data.push({ locator: cell, type: match[1], row: +match[2], col: +match[3] });
            }
            for (const a of data) {
              if (!data.some(b => b !== a && b.type === a.type && Math.abs(b.row - a.row) + Math.abs(b.col - a.col) === 1)) continue;
              await a.locator.tap({ force: true });
              return true;
            }
            return false;
          }

          await page.goto(`${url}?deep_live_playcheck=${Date.now()}`, { waitUntil: 'networkidle', timeout: 60000 });
          const seededSave = {
            version: 1, playerName: 'LIO', level: 1, exp: 0, hp: 22, maxHp: 22, gold: 18,
            mapId: 'world', position: { x: 8, y: 23 }, direction: 'right',
            lastInn: { mapId: 'hearthVillage', position: { x: 8, y: 10 } },
            inventory: [{ id: 'herb', count: 2 }, { id: 'smoke', count: 1 }], inventorySlots: 4,
            equipmentOwned: ['travellerCoat'], equipment: { weapon: null, armor: 'travellerCoat', charm: null },
            techniques: [], techniqueSlots: 2,
            memos: [{ id: 'journey', title: '最初の旅', text: '村の長から北のOld Templeについて聞く。', read: false }],
            flags: ['story:openingSeen'], openedChests: [], defeatedEncounters: [], defeatedEnemies: {}, releasedEnemies: {}, battleLog: [],
            steps: 20, playSeconds: 60, encounterMeter: 3, settings: { music: false, sfx: false },
          };
          await page.evaluate(save => localStorage.setItem('puzzle-rpg:rpg-mode:v1', JSON.stringify(save)), seededSave);
          await page.reload({ waitUntil: 'networkidle' });

          await page.getByRole('button', { name: /RPG MODE/i }).tap();
          const continueButton = page.getByRole('button', { name: /CONTINUE/i });
          if (await continueButton.count()) await continueButton.first().tap();
          const field = await snapshot('01-seeded-field');
          assert('Seeded save reaches field', /PRISM ROAD/i.test(field.bodyText));
          assert('Field controls meet 44px target', field.tinyButtons.length === 0, { tiny: field.tinyButtons });
          assert('Field has no horizontal overflow', field.overflow.length === 0, { overflow: field.overflow });

          for (let step = 0; step < 6 && !(await page.locator('main[data-enemy]').count()); step++) {
            await tapButton('Move right'); await page.waitForTimeout(250);
          }
          await page.waitForTimeout(850);
          const battle = await snapshot('02-rpg-encounter');
          const battleVisible = await page.locator('main[data-enemy]').count() > 0;
          assert('Field movement triggers RPG encounter', battleVisible);
          assert('Battle controls meet 44px target', battle.tinyButtons.length === 0, { tiny: battle.tinyButtons });
          assert('Battle has no horizontal overflow', battle.overflow.length === 0, { overflow: battle.overflow });

          if (battleVisible) {
            const turn1 = Number(battle.bodyText.match(/TURN\s+(\d+)/i)?.[1] ?? 0);
            await tapButton(/RPG COMMAND/i);
            const command = await snapshot('03-rpg-command');
            assert('Command exposes TALK ITEM STATUS RUN', ['TALK','ITEM','STATUS','RUN'].every(v => command.bodyText.includes(v)));
            assert('Command buttons meet 44px target', command.tinyButtons.length === 0, { tiny: command.tinyButtons });

            await tapButton(/STATUS/i);
            const status = await snapshot('04-rpg-status');
            assert('STATUS opens without consuming turn', /TECHNIQUES/i.test(status.bodyText));
            assert('STATUS buttons meet 44px target', status.tinyButtons.length === 0, { tiny: status.tinyButtons });
            await tapButton(/BACK/i); await tapButton(/B\s*•\s*CLOSE/i);

            const clusterTapped = await tapCluster();
            await page.waitForTimeout(1350);
            const afterMove = await snapshot('05-rpg-after-cluster');
            const turn2 = Number(afterMove.bodyText.match(/TURN\s+(\d+)/i)?.[1] ?? 0);
            assert('Cluster advances battle turn', clusterTapped && turn2 > turn1, { turn1, turn2 });

            await tapButton(/RPG COMMAND/i); await tapButton(/TALK/i); await page.waitForTimeout(1200);
            const afterTalk = await snapshot('06-rpg-after-talk');
            const turn3 = Number(afterTalk.bodyText.match(/TURN\s+(\d+)/i)?.[1] ?? 0);
            assert('TALK consumes one battle turn', turn3 > turn2 && await page.locator('main[data-enemy]').count() > 0, { turn2, turn3 });
          }

          report.finishedAt = new Date().toISOString();
          await writeFile(path.join(outputDir, 'report.json'), JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          await browser.close();

          const failures = report.assertions.filter(item => !item.pass);
          const assetFailures = report.failedResponses.filter(item => item.url.includes('/assets/'));
          if (failures.length || report.pageErrors.length || assetFailures.length || report.failedResponses.some(item => item.status >= 500)) process.exitCode = 1;
          EOF
          cd /tmp/puzzle-rpg-deep-check
          node check.mjs

      - name: Upload deep playcheck screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-rpg-deep-live-playcheck
          path: deep-playcheck-artifacts
          retention-days: 2
