name: Chapter Battle Clock Shield Pass
on:
  push:
    paths:
      - '.github/workflows/pass-chapter-clock-shield.yml'

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Apply chapter clock and shield pass
        run: python3 scripts/pass-chapter-clock-shield.py
      - name: Source assertions
        run: |
          grep -q 'Enemy time stop' app/PuzzleRPGClusterBreak.tsx
          grep -q 'SHIELD BREAK' app/PuzzleRPGClusterBreak.tsx
          grep -q 'pixelStopwatchMini' app/PuzzleRPGClusterBreak.tsx
          grep -q 'pixelShieldMini' app/PuzzleRPGClusterBreak.tsx
          grep -q 'CHAPTER 8BIT CLOCK + SHIELD FX' app/PuzzleRPGClusterBreak.module.css
      - name: Install dependencies
        run: npm ci
      - name: Puzzle RPG TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Commit implementation
        run: |
          rm scripts/pass-chapter-clock-shield.py .github/workflows/pass-chapter-clock-shield.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add 8bit clock and shield feedback to Chapter Battle'
          git push origin main
