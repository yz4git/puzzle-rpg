name: Endgame Balance Audit

on:
  push:
    branches:
      - feature/endgame-balance-20260827

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Prepare fast endgame-only review build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/PuzzleRPGClusterBreak.tsx')
          s=p.read_text()
          for hp in (18,25,32,38,45):
              s=s.replace(f'hp: {hp}, powerBonus:', 'hp: 1, powerBonus:', 1)
          s=s.replace('await delay(count >= 8 ? 150 : 115);','await delay(5);')
          s=s.replace('await delay(215);','await delay(8);')
          s=s.replace('await delay(330);','await delay(8);')
          s=s.replace('await delay(390);','await delay(8);')
          p.write_text(s)
          PY
      - name: Start review server
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/puzzle-rpg-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/puzzle-rpg-server.log
          exit 1
      - name: Run 3 endgame audits
        run: node scripts/endgame-balance-audit.mjs
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-rpg-endgame-balance-audit
          path: endgame-balance-audit
          if-no-files-found: ignore
