name: SFC Visual Reconstruction Pass 12
on:
  push:
    branches: [visual/reconstruction-pass-sfc12]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Pass 12 touch control deck
        run: python scripts/apply-sfc-visual-pass12.py
      - name: Puzzle RPG TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Review diff
        run: git diff --check && git diff --stat
      - name: Save Pass 12 implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/rpg/RPGMode.module.css PROGRESS.md
          git commit -m "Implement SFC visual reconstruction pass 12"
          git push
