name: Prism Overdrive Escalation VFX
on:
  push:
    paths:
      - 'scripts/pass-overdrive-escalation-vfx.py'
      - '.github/workflows/pass-overdrive-escalation-vfx.yml'
jobs:
  pass:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Apply escalation VFX redesign
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/pass-overdrive-escalation-vfx.py')
          s=p.read_text()
          s=s.replace('className={styles.spatialFx} data-phase={boardFx.phase} data-kind={boardFx.kind}', 'className={styles.spatialFx} data-kind={boardFx.kind} data-phase={boardFx.phase}')
          s=s.replace('.fever .shell::before', '.shell.fever::before').replace('.final .shell::before', '.shell.final::before')
          p.write_text(s)
          PY
          python3 scripts/pass-overdrive-escalation-vfx.py
          cat >> app/PrismOverdrive.module.css <<'CSS'
          /* Keep MEGA geometry centered on the actual impact anchor, not the board center. */
          .spatialFx[data-kind="attack"][data-mega="true"]::before,.spatialFx[data-kind="attack"][data-mega="true"]::after{display:none}
          .spatialFx[data-kind="attack"][data-mega="true"] .impactRing::before,.spatialFx[data-kind="attack"][data-mega="true"] .impactRing::after{content:"";position:absolute;inset:-10px;border:4px solid #fff2a8;transform:rotate(45deg);animation:megaLocalDiamond 420ms steps(5,end) forwards}
          .spatialFx[data-kind="attack"][data-mega="true"] .impactRing::after{inset:-20px;border-color:#ff6b25;animation-delay:60ms}
          @keyframes megaLocalDiamond{0%{opacity:1;transform:rotate(45deg) scale(.45);filter:brightness(3)}100%{opacity:0;transform:rotate(135deg) scale(4.2);filter:brightness(1)}}
          CSS
      - run: npm ci
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Browser QA setup
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install chromium
          bash scripts/sites-env.sh -- ./node_modules/.bin/vinext start --port 4173 >/tmp/overdrive-escalation-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
      - name: Escalation visual gameplay QA
        run: |
          mkdir -p /tmp/overdrive-escalation-qa
          cat > qa-overdrive-escalation.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const errors=[];
          const page=await browser.newPage({viewport:{width:402,height:874},deviceScaleFactor:1});
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
          await page.getByRole('button',{name:/PRISM OVERDRIVE/}).click();
          await page.getByRole('button',{name:/START OVERDRIVE/}).click();
          const board=page.locator('[aria-label="Prism Overdrive Cluster Break board"]');
          await board.waitFor();
          let dropSeen=false, feverSeen=false, megaSeen=false;
          async function clickLargest(){
            const buttons=board.locator('button'); const n=await buttons.count();
            const cells=[];
            for(let i=0;i<n;i++){
              const b=buttons.nth(i); const label=await b.getAttribute('aria-label');
              if(!label) continue;
              const m=label.match(/^(ATK|HEAL|BAR|SKIP).*row (\d+) column (\d+)$/);
              if(m) cells.push({i,type:m[1],r:Number(m[2])-1,c:Number(m[3])-1});
            }
            const map=new Map(cells.map(x=>[`${x.r}:${x.c}`,x])); const seen=new Set(); let best=[];
            for(const cell of cells){
              const key=`${cell.r}:${cell.c}`; if(seen.has(key)) continue;
              const stack=[cell], group=[]; seen.add(key);
              while(stack.length){const x=stack.pop(); group.push(x); for(const [r,c] of [[x.r-1,x.c],[x.r+1,x.c],[x.r,x.c-1],[x.r,x.c+1]]){const k=`${r}:${c}`,y=map.get(k);if(y&&y.type===cell.type&&!seen.has(k)){seen.add(k);stack.push(y)}}}
              if(group.length>best.length) best=group;
            }
            const target=buttons.nth(best[0]?.i ?? 0); await target.click(); return best.length;
          }
          await page.screenshot({path:'/tmp/overdrive-escalation-qa/start.jpg',type:'jpeg',quality:92});
          for(let turn=0;turn<20;turn++){
            await clickLargest();
            for(let p=0;p<12;p++){
              await page.waitForTimeout(85);
              const drop=page.locator('[class*="spatialFx"][data-phase="drop"]');
              if(!dropSeen && await drop.isVisible().catch(()=>false)){dropSeen=true;await page.screenshot({path:'/tmp/overdrive-escalation-qa/drop-physics.jpg',type:'jpeg',quality:92});}
              const mega=page.locator('[class*="spatialFx"][data-mega="true"]');
              if(!megaSeen && await mega.isVisible().catch(()=>false)){megaSeen=true;await page.screenshot({path:'/tmp/overdrive-escalation-qa/mega-atk.jpg',type:'jpeg',quality:92});}
              const fever=page.locator('[class*="modeTransform"][data-kind="fever"], [class*="modeTransform"][data-kind="overFever"]');
              if(!feverSeen && await fever.isVisible().catch(()=>false)){feverSeen=true;await page.screenshot({path:'/tmp/overdrive-escalation-qa/fever-transform.jpg',type:'jpeg',quality:92});}
            }
            if(dropSeen && feverSeen && megaSeen) break;
          }
          await page.screenshot({path:'/tmp/overdrive-escalation-qa/active.jpg',type:'jpeg',quality:92});

          const fast=await browser.newPage({viewport:{width:402,height:874},deviceScaleFactor:1});
          fast.on('pageerror',e=>errors.push(String(e)));
          await fast.addInitScript(() => {
            const realNow=performance.now.bind(performance); const base=realNow();
            Object.defineProperty(performance,'now',{configurable:true,value:()=>base+(realNow()-base)*30});
            const realSetInterval=window.setInterval.bind(window);
            Object.defineProperty(window,'setInterval',{configurable:true,value:(fn,ms,...args)=>realSetInterval(fn,Math.min(Number(ms)||0,20),...args)});
          });
          await fast.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
          await fast.getByRole('button',{name:/PRISM OVERDRIVE/}).click();
          await fast.getByRole('button',{name:/START OVERDRIVE/}).click();
          let finalSeen=false;
          for(let i=0;i<180;i++){
            await fast.waitForTimeout(80);
            const final=fast.locator('[class*="modeTransform"][data-kind="final"]');
            if(await final.isVisible().catch(()=>false)){finalSeen=true;await fast.screenshot({path:'/tmp/overdrive-escalation-qa/final-transform.jpg',type:'jpeg',quality:92});break;}
          }
          const finalShell=fast.locator('main[class*="final"]');
          const finalActive=await finalShell.isVisible().catch(()=>false);
          if(finalActive) await fast.screenshot({path:'/tmp/overdrive-escalation-qa/final-active.jpg',type:'jpeg',quality:92});
          const b=await board.boundingBox(); const feed=await page.locator('[class*="actionFeed"]').boundingBox();
          const result={errors,dropSeen,feverSeen,megaSeen,finalSeen,finalActive,board:b,feed,scrollWidth:await page.evaluate(()=>document.documentElement.scrollWidth),innerWidth:await page.evaluate(()=>innerWidth)};
          fs.writeFileSync('/tmp/overdrive-escalation-qa/review.json',JSON.stringify(result,null,2));
          if(errors.length) throw new Error(errors.join('\n'));
          if(!dropSeen) throw new Error('drop physics VFX not observed');
          if(!finalSeen && !finalActive) throw new Error('FINAL escalation not observed');
          if(b && feed && feed.y < b.y+b.height) throw new Error('action feed overlaps board');
          if(result.scrollWidth>result.innerWidth) throw new Error('horizontal overflow');
          await browser.close();
          NODE
          node qa-overdrive-escalation.mjs
          rm qa-overdrive-escalation.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: prism-overdrive-escalation-vfx-qa
          path: /tmp/overdrive-escalation-qa
          retention-days: 1
      - name: Commit and cleanup
        run: |
          rm -f scripts/pass-overdrive-escalation-vfx.py .github/workflows/pass-overdrive-escalation-vfx.yml
          git config user.name 'yz4git'
          git config user.email '65384484+yz4git@users.noreply.github.com'
          git add app/PrismOverdrive.tsx app/PrismOverdrive.module.css app/gameAudio.ts scripts .github/workflows
          git commit -m 'Escalate Prism Overdrive fever and final VFX'
          git push origin HEAD:main
