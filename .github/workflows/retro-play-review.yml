name: Retro Play Review
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retro-play-review.yml'
      - 'scripts/retro-review.mjs'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --legacy-peer-deps playwright
      - run: npx playwright install --with-deps chromium
      - name: Run mobile play review
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/puzzle-dev.log 2>&1 &
          PID=$!
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/retro-review.mjs
          kill $PID || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retro-play-review
          path: review-artifact
