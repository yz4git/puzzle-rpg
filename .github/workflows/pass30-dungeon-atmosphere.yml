name: SFC Pass 30 Dungeon Atmosphere

on:
  push:
    paths:
      - '.github/workflows/pass30-dungeon-atmosphere.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply dungeon atmosphere pass
        run: python3 scripts/pass30_dungeon_atmosphere.py
      - name: Install dependencies
        run: npm ci
      - name: Puzzle RPG TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Commit pass
        run: |
          rm scripts/pass30_dungeon_atmosphere.py .github/workflows/pass30-dungeon-atmosphere.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement SFC visual reconstruction pass 30'
          git push
