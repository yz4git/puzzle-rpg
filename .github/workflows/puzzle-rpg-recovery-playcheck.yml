name: Puzzle RPG Recovery Route Playcheck

on:
  push:
    paths:
      - .github/workflows/puzzle-rpg-recovery-playcheck.yml
  workflow_run:
    workflows: ["Deploy Puzzle RPG to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  PLAYCHECK_URL: https://yz4git.github.io/puzzle-rpg/

jobs:
  recovery-route:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install Playwright
        run: |
          mkdir -p /tmp/puzzle-rpg-recovery-check
          cd /tmp/puzzle-rpg-recovery-check
          npm init -y
          npm install --no-audit --no-fund playwright@latest
          npx playwright install --with-deps chromium
      - name: Play item, escape, and defeat recovery routes
        run: |
          mkdir -p "$GITHUB_WORKSPACE/recovery-playcheck-artifacts"
          cat > /tmp/puzzle-rpg-recovery-check/check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          import path from 'node:path';

          const url = process.env.PLAYCHECK_URL;
          const out = path.join(process.env.GITHUB_WORKSPACE, 'recovery-playcheck-artifacts');
          const report = { assertions: [], scenes: [], consoleErrors: [], pageErrors: [], failedResponses: [] };
          const assert = (name, pass, detail = {}) => report.assertions.push({ name, pass: Boolean(pass), ...detail });
          const browser = await chromium.launch({ headless: true });

          function baseSave(overrides = {}) {
            return {
              version: 1, playerName: 'LIO', level: 1, exp: 0, hp: 22, maxHp: 22, gold: 100,
              mapId: 'world', position: { x: 10, y: 19 }, direction: 'right',
              lastInn: { mapId: 'hearthVillage', position: { x: 8, y: 10 } },
              inventory: [{ id: 'herb', count: 2 }, { id: 'smoke', count: 1 }], inventorySlots: 4,
              equipmentOwned: ['travellerCoat'], equipment: { weapon: null, armor: 'travellerCoat', charm: null },
              techniques: ['gentleHand'], techniqueSlots: 2,
              memos: [{ id: 'journey', title: '最初の旅', text: '北のOld Templeへ向かう。', read: false }],
              flags: ['story:openingSeen'], openedChests: [], defeatedEncounters: [], defeatedEnemies: {}, releasedEnemies: {}, battleLog: [],
              steps: 20, playSeconds: 60, encounterMeter: 12, settings: { music: false, sfx: false },
              ...overrides,
            };
          }

          async function makePage(save, tag) {
            const context = await browser.newContext({ viewport: { width: 393, height: 852 }, screen: { width: 393, height: 852 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true, locale: 'ja-JP', colorScheme: 'dark' });
            const page = await context.newPage();
            page.on('console', msg => { if (msg.type() === 'error') report.consoleErrors.push(`${tag}: ${msg.text()}`); });
            page.on('pageerror', err => report.pageErrors.push(`${tag}: ${String(err)}`));
            page.on('response', res => { if (res.status() >= 400) report.failedResponses.push({ tag, status: res.status(), url: res.url() }); });
            await page.goto(`${url}?recovery_route=${tag}-${Date.now()}`, { waitUntil: 'networkidle', timeout: 60000 });
            await page.evaluate(value => localStorage.setItem('puzzle-rpg:rpg-mode:v1', JSON.stringify(value)), save);
            await page.reload({ waitUntil: 'networkidle' });
            await page.getByRole('button', { name: /RPG MODE/i }).tap();
            const cont = page.getByRole('button', { name: /CONTINUE/i });
            if (await cont.count()) await cont.first().tap();
            return { context, page };
          }

          async function shot(page, name) {
            await page.waitForTimeout(420);
            const metrics = await page.evaluate(() => {
              const buttons = [...document.querySelectorAll('button')].filter(el => {
                const s = getComputedStyle(el), r = el.getBoundingClientRect();
                return s.display !== 'none' && s.visibility !== 'hidden' && r.width > 0 && r.height > 0 && r.bottom > 0 && r.top < innerHeight;
              }).map(el => {
                const r = el.getBoundingClientRect();
                return { text: (el.innerText || el.getAttribute('aria-label') || '').replace(/\s+/g, ' ').trim().slice(0, 120), width: Math.round(r.width), height: Math.round(r.height), x: Math.round(r.x), y: Math.round(r.y) };
              });
              return { text: document.body.innerText.replace(/\s+/g, ' ').slice(0, 9000), width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight, buttons, tinyButtons: buttons.filter(b => b.width < 44 || b.height < 44) };
            });
            report.scenes.push({ name, ...metrics });
            await page.screenshot({ path: path.join(out, `${name}.png`), fullPage: true });
            return metrics;
          }

          async function tap(page, name) {
            const button = page.getByRole('button', { name });
            if (!(await button.count())) return false;
            await button.first().tap({ force: true });
            return true;
          }

          async function openCommand(page) {
            const launcher = page.getByRole('button', { name: /RPG COMMAND/i });
            await launcher.first().tap({ force: true });
            const win = page.locator('[class*="commandWindow"]');
            await win.waitFor({ state: 'visible', timeout: 2500 });
            return win;
          }

          // Scenario A: HERB consumes one turn and one item, then SMOKE escapes and persists inventory.
          {
            const { context, page } = await makePage(baseSave({ hp: 10, gold: 30 }), 'item');
            await tap(page, /A\s*CHECK/i);
            await page.waitForTimeout(700);
            const start = await shot(page, '01-item-battle-start');
            assert('Item scenario starts at 10 HP', /HP 10\/22/i.test(start.text));

            let win = await openCommand(page);
            await win.locator('button').filter({ hasText: 'ITEM' }).first().tap({ force: true });
            await page.waitForTimeout(120);
            win = page.locator('[class*="commandWindow"]');
            const herb = win.locator('button').filter({ hasText: /HERB.*×2/i }).first();
            assert('HERB ×2 is available', await herb.count() > 0);
            await herb.tap({ force: true });
            await page.waitForTimeout(1150);
            const afterHerb = await shot(page, '02-after-herb');
            assert('HERB heals 6 then enemy deals 2', /HP 14\/22/i.test(afterHerb.text), { text: afterHerb.text.slice(0, 500) });
            assert('HERB consumes exactly one turn', /TURN 2/i.test(afterHerb.text));

            win = await openCommand(page);
            await win.locator('button').filter({ hasText: 'ITEM' }).first().tap({ force: true });
            await page.waitForTimeout(120);
            const itemPage = await shot(page, '03-item-count-after-herb');
            assert('HERB count decrements to one', /HERB ×1/i.test(itemPage.text));
            const smoke = page.locator('[class*="commandWindow"] button').filter({ hasText: /SMOKE.*×1/i }).first();
            assert('SMOKE ×1 is available', await smoke.count() > 0);
            await smoke.tap({ force: true });
            await page.waitForTimeout(650);
            const escaped = await shot(page, '04-smoke-escaped');
            assert('SMOKE reaches ESCAPED result', /ESCAPED/i.test(escaped.text));
            assert('Escape result has no undersized controls', escaped.tinyButtons.length === 0, { tiny: escaped.tinyButtons });
            await tap(page, /CONTINUE/i);
            await page.waitForTimeout(600);
            const stored = await page.evaluate(() => JSON.parse(localStorage.getItem('puzzle-rpg:rpg-mode:v1') || '{}'));
            const herbStack = stored.inventory?.find?.(item => item.id === 'herb');
            const smokeStack = stored.inventory?.find?.(item => item.id === 'smoke');
            assert('Used HERB persists after escape', herbStack?.count === 1, { inventory: stored.inventory });
            assert('Used SMOKE is removed after escape', !smokeStack, { inventory: stored.inventory });
            await context.close();
          }

          // Scenario B: defeat loses only 15% gold and returns to the last inn with progression intact.
          {
            const seeded = baseSave({ hp: 1, gold: 100, inventory: [{ id: 'herb', count: 2 }], techniques: ['gentleHand'], flags: ['story:openingSeen', 'test:progress'] });
            const { context, page } = await makePage(seeded, 'defeat');
            await tap(page, /A\s*CHECK/i);
            await page.waitForTimeout(700);
            let win = await openCommand(page);
            const talk = win.locator('button').filter({ hasText: 'TALK' }).first();
            await talk.tap({ force: true });
            await page.waitForTimeout(1700);
            const result = await shot(page, '05-defeat-result');
            assert('1 HP player reaches YOU AWAKEN after enemy hit', /YOU AWAKEN/i.test(result.text));
            assert('Defeat report explains 15 GOLD loss', /15 GOLD/i.test(result.text));
            assert('Defeat result controls meet 44px target', result.tinyButtons.length === 0, { tiny: result.tinyButtons });

            const savedAtResult = await page.evaluate(() => JSON.parse(localStorage.getItem('puzzle-rpg:rpg-mode:v1') || '{}'));
            assert('Defeat deducts exactly 15% rounded up', savedAtResult.gold === 85, { gold: savedAtResult.gold });
            assert('Defeat restores full HP', savedAtResult.hp === savedAtResult.maxHp && savedAtResult.maxHp === 22, { hp: savedAtResult.hp, maxHp: savedAtResult.maxHp });
            assert('Defeat relocates to last inn map', savedAtResult.mapId === 'hearthVillage', { mapId: savedAtResult.mapId });
            assert('Defeat keeps learned technique', savedAtResult.techniques?.includes('gentleHand'));
            assert('Defeat keeps equipment', savedAtResult.equipment?.armor === 'travellerCoat');
            assert('Defeat keeps story/progress flag', savedAtResult.flags?.includes('test:progress'));
            assert('Defeat keeps inventory', savedAtResult.inventory?.find?.(item => item.id === 'herb')?.count === 2, { inventory: savedAtResult.inventory });

            await tap(page, /CONTINUE/i);
            await page.waitForTimeout(700);
            const returned = await shot(page, '06-returned-to-inn');
            assert('CONTINUE returns to Hearth Village field', /HEARTH VILLAGE/i.test(returned.text) || /VILLAGE/i.test(returned.text), { text: returned.text.slice(0, 500) });
            assert('Recovered field controls meet 44px target', returned.tinyButtons.length === 0, { tiny: returned.tinyButtons });
            await context.close();
          }

          report.consoleErrors = [...new Set(report.consoleErrors)];
          report.pageErrors = [...new Set(report.pageErrors)];
          report.failedResponses = report.failedResponses.filter((v, i, a) => a.findIndex(x => x.status === v.status && x.url === v.url && x.tag === v.tag) === i);
          await writeFile(path.join(out, 'report.json'), JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          await browser.close();
          const failures = report.assertions.filter(a => !a.pass);
          if (failures.length || report.consoleErrors.length || report.pageErrors.length || report.failedResponses.some(r => r.status >= 400)) process.exitCode = 1;
          EOF
          cd /tmp/puzzle-rpg-recovery-check
          node check.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-rpg-recovery-route-playcheck
          path: recovery-playcheck-artifacts
          retention-days: 2
