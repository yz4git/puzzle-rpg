name: Tactical Preview QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tactical-preview-qa.yml']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --legacy-peer-deps playwright
      - run: npx playwright install --with-deps chromium
      - name: Check tactical preview UI
        run: |
          cat > /tmp/tactical-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:402,height:874},isMobile:true,hasTouch:true,deviceScaleFactor:3});
          const errors=[]; page.on('console',m=>{if(m.type()==='error')errors.push(m.text())}); page.on('pageerror',e=>errors.push(e.message));
          fs.mkdirSync('qa-artifact',{recursive:true});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.getByRole('button',{name:'START GAME'}).click(); await page.waitForTimeout(120);
          await page.screenshot({path:'qa-artifact/01-intro.png',fullPage:true});
          await page.getByRole('button',{name:'BATTLE START'}).click(); await page.waitForTimeout(180);
          const enemyBox=await page.locator('svg[aria-label="Void Warden"]').boundingBox();
          const readBoard=async()=>{const a=await page.locator('button[aria-label*=" orb row "]').evaluateAll(bs=>bs.map(b=>b.getAttribute('aria-label')));const b=Array.from({length:6},()=>Array(6));for(const x of a){const m=x.match(/^(\w+) orb row (\d+) column (\d+)$/);b[+m[2]-1][+m[3]-1]=m[1]}return b};
          const matches=b=>{const h=new Set();for(let r=0;r<6;r++){let s=0;for(let c=1;c<=6;c++){if(c<6&&b[r][c]===b[r][s])continue;if(c-s>=3)for(let x=s;x<c;x++)h.add(`${r}:${x}`);s=c}}for(let c=0;c<6;c++){let s=0;for(let r=1;r<=6;r++){if(r<6&&b[r][c]===b[s][c])continue;if(r-s>=3)for(let y=s;y<r;y++)h.add(`${y}:${c}`);s=r}}return h};
          const swap=(b,a,z)=>{const n=b.map(r=>r.slice());[n[a.r][a.c],n[z.r][z.c]]=[n[z.r][z.c],n[a.r][a.c]];return n};
          const best=b=>{let q=null;for(let r=0;r<6;r++)for(let c=0;c<6;c++)for(const [dr,dc] of [[0,1],[1,0]]){const rr=r+dr,cc=c+dc;if(rr>=6||cc>=6)continue;const h=matches(swap(b,{r,c},{r:rr,c:cc}));if(h.size&&(!q||h.size>q.n))q={a:{r,c},b:{r:rr,c:cc},n:h.size}}return q};
          const cell=p=>page.getByRole('button',{name:new RegExp(`orb row ${p.r+1} column ${p.c+1}$`)});
          let b=await readBoard(),m=best(b); await cell(m.a).click(); await page.waitForTimeout(50);
          const previewTexts=await page.locator('button[aria-label*=" orb row "] small').allTextContents();
          await page.screenshot({path:'qa-artifact/02-previews.png',fullPage:true});
          await cell(m.b).click();
          let attackSeen=false; try{await page.getByText('HIT!',{exact:true}).waitFor({state:'visible',timeout:2600});attackSeen=true;await page.screenshot({path:'qa-artifact/03-attack.png',fullPage:true})}catch{}
          await page.waitForTimeout(900);
          const metrics=await page.evaluate(()=>({scrollY:scrollY,scrollHeight:document.documentElement.scrollHeight,innerHeight,tiles:document.querySelectorAll('button[aria-label*=" orb row "]').length}));
          fs.writeFileSync('qa-artifact/report.json',JSON.stringify({enemyBox,previewTexts,attackSeen,metrics,errors},null,2));
          await browser.close();
          JS
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/puzzle.log 2>&1 & PID=$!
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node /tmp/tactical-qa.mjs
          kill $PID || true
      - uses: actions/upload-artifact@v4
        with:
          name: tactical-preview-qa
          path: qa-artifact
