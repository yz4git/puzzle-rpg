name: SFC Pass 29 Town Life

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pass29-town-life.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply town life pass
        run: python scripts/pass29_town_life.py
      - name: Install dependencies
        run: npm ci
      - name: Puzzle RPG TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Commit pass
        run: |
          rm scripts/pass29_town_life.py .github/workflows/pass29-town-life.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/rpg/RPGMode.tsx PROGRESS.md scripts/pass29_town_life.py .github/workflows/pass29-town-life.yml
          git commit -m 'Implement SFC visual reconstruction pass 29'
          git push
