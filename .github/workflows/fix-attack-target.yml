name: Fix Attack Target
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-attack-target.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move attack impact onto enemy visual
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/PuzzleRPGGame.module.css')
          s=p.read_text()
          s=s.replace('.playerAttackFx::before { content:""; position:absolute; left:50%; top:18%;', '.playerAttackFx::before { content:""; position:absolute; left:clamp(52px,14%,64px); top:clamp(70px,10%,88px);', 1)
          s=s.replace('.playerAttackFx b { position:absolute; left:50%; top:18%;', '.playerAttackFx b { position:absolute; left:clamp(52px,14%,64px); top:clamp(70px,10%,88px);', 1)
          s=s.replace('100%{left:50%;top:18%;opacity:.1;transform:scale(.35)}', '100%{left:clamp(52px,14%,64px);top:clamp(70px,10%,88px);opacity:.1;transform:scale(.35)}', 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add app/PuzzleRPGGame.module.css
          git commit -m "Aim puzzle attacks at enemy visual"
          git push origin HEAD:main
