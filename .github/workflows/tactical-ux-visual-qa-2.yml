name: Tactical UX Visual QA 2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tactical-ux-visual-qa-2.yml']
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          nohup npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/app.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/app.log; exit 1
      - name: Verify title selection setup damage attack
        run: |
          mkdir -p tactical-qa2
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright'; import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:402,height:874},isMobile:true,hasTouch:true,deviceScaleFactor:3});
          const errors=[]; page.on('console',m=>{if(m.type()==='error')errors.push(m.text())}); page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          const snap=n=>page.screenshot({path:`tactical-qa2/${n}.png`,fullPage:true});
          const vis=s=>page.locator(s).first().isVisible().catch(()=>false);
          const board=async()=>{const ls=await page.locator('button[aria-label*=" orb row "]').evaluateAll(bs=>bs.map(b=>b.getAttribute('aria-label')||''));const a=Array.from({length:6},()=>Array(6).fill(''));for(const l of ls){const m=l.match(/^(fire|water|light|heart|guard) orb row (\d+) column (\d+)$/);if(m)a[+m[2]-1][+m[3]-1]=m[1]}return a};
          const clone=b=>b.map(r=>[...r]); const sw=(b,a,c)=>{const n=clone(b);[n[a.r][a.c],n[c.r][c.c]]=[n[c.r][c.c],n[a.r][a.c]];return n};
          const hasMatch=b=>{for(let r=0;r<6;r++)for(let c=0;c<4;c++)if(b[r][c]===b[r][c+1]&&b[r][c]===b[r][c+2])return true;for(let c=0;c<6;c++)for(let r=0;r<4;r++)if(b[r][c]===b[r+1][c]&&b[r][c]===b[r+2][c])return true;return false};
          const pairs=[];for(let r=0;r<6;r++)for(let c=0;c<6;c++){if(c<5)pairs.push([{r,c},{r,c:c+1}]);if(r<5)pairs.push([{r,c},{r:r+1,c}])}
          const click=async(b,p)=>page.getByRole('button',{name:`${b[p.r][p.c]} orb row ${p.r+1} column ${p.c+1}`}).click({timeout:5000});
          const waitReady=async()=>{for(let i=0;i<100;i++){if(await vis('[class*="stageIntroOverlay"]'))return; if(await page.locator('button[aria-label*=" orb row "]:disabled').count()===0)return; await page.waitForTimeout(80)}};
          await snap('01-title'); const title=await vis('[class*="titleScreen"]');
          await page.getByRole('button',{name:'START GAME'}).click(); await page.waitForTimeout(100); await snap('02-intro');
          await page.getByRole('button',{name:'BATTLE START'}).click(); await page.waitForTimeout(120);
          const b0=await board(); await click(b0,{r:2,c:2}); await page.waitForTimeout(80); const adjacent=await page.locator('button[class*="adjacentChoice"]').count(); await snap('03-selection'); await click(b0,{r:2,c:2});
          const b1=await board(); let setup=null; for(const p of pairs){if(!hasMatch(sw(b1,p[0],p[1]))){setup=p;break}};
          let damage=false; if(setup){await click(b1,setup[0]); await click(b1,setup[1]); damage=await page.locator('[class*="damageVignette"]').waitFor({state:'visible',timeout:4000}).then(()=>true).catch(()=>false); await snap('04-damage'); await waitReady();}
          const status=(await page.locator('[role="status"]').textContent())||''; const skill=(await page.getByRole('button',{name:/PRISM SHIFT/}).textContent())||'';
          const b2=await board(); let match=null; for(const p of pairs){if(hasMatch(sw(b2,p[0],p[1]))){match=p;break}};
          let attack=false; if(match){await click(b2,match[0]); await click(b2,match[1]); attack=await page.locator('[class*="playerAttackFx"]').waitFor({state:'visible',timeout:6000}).then(()=>true).catch(()=>false); await snap('05-attack'); await waitReady();}
          const metrics=await page.evaluate(()=>({w:innerWidth,h:innerHeight,sw:document.documentElement.scrollWidth,sh:document.documentElement.scrollHeight,tiles:document.querySelectorAll('button[aria-label*=" orb row "]').length}));
          const report={title,adjacent,setup,status,skill,damage,attack,metrics,errors}; fs.writeFileSync('tactical-qa2/report.json',JSON.stringify(report,null,2)); console.log(JSON.stringify(report,null,2)); await browser.close();
          EOF
          node qa.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tactical-ux-qa2
          path: tactical-qa2/
