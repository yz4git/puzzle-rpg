name: Prism Overdrive Tactile Depth
on:
  push:
    paths:
      - 'scripts/pass-overdrive-tactile-depth.py'
      - '.github/workflows/pass-overdrive-tactile-depth.yml'
jobs:
  pass:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Apply tactile depth pass
        run: python3 scripts/pass-overdrive-tactile-depth.py
      - run: npm ci
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Browser QA setup
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install chromium
          bash scripts/sites-env.sh -- ./node_modules/.bin/vinext start --port 4173 >/tmp/overdrive-tactile-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
      - name: Tactile and reward visual QA
        run: |
          mkdir -p /tmp/overdrive-tactile-qa
          cat > qa-overdrive-tactile.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const errors=[];

          const page=await browser.newPage({viewport:{width:402,height:874},deviceScaleFactor:1});
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
          await page.getByRole('button',{name:/PRISM OVERDRIVE/}).click();
          await page.getByRole('button',{name:/START OVERDRIVE/}).click();
          const board=page.locator('[aria-label="Prism Overdrive Cluster Break board"]');
          await board.waitFor();
          const backLayers=await page.locator('[class*="backFx"] > *').count();
          const first=board.locator('button:not([disabled])').first();
          const box=await first.boundingBox();
          if(!box) throw new Error('first tile has no box');
          await page.mouse.move(box.x+box.width/2,box.y+box.height/2);
          await page.mouse.down();
          await page.waitForTimeout(70);
          const pressedSeen=await page.locator('[class*="pressed"]').isVisible().catch(()=>false);
          if(pressedSeen) await page.screenshot({path:'/tmp/overdrive-tactile-qa/01-pressed.jpg',type:'jpeg',quality:92});
          await page.mouse.up();
          let burstSeen=false, scoreSeen=false;
          for(let i=0;i<24;i++){
            await page.waitForTimeout(55);
            const wrap=page.locator('[class*="boardWrap"][data-phase="burst"]');
            if(await wrap.isVisible().catch(()=>false)){
              burstSeen=true;
              scoreSeen=await page.locator('[class*="scorePop"][data-score]').isVisible().catch(()=>false);
              await page.screenshot({path:'/tmp/overdrive-tactile-qa/02-burst-depth.jpg',type:'jpeg',quality:92});
              break;
            }
          }

          // Deterministic board forces cascade and jackpot rebuild after the second user clear.
          const reward=await browser.newPage({viewport:{width:402,height:874},deviceScaleFactor:1});
          reward.on('pageerror',e=>errors.push(String(e)));
          await reward.addInitScript(()=>{Math.random=()=>0.1});
          await reward.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
          await reward.getByRole('button',{name:/PRISM OVERDRIVE/}).click();
          await reward.getByRole('button',{name:/START OVERDRIVE/}).click();
          const rewardBoard=reward.locator('[aria-label="Prism Overdrive Cluster Break board"]');
          await rewardBoard.waitFor();
          let chainEdgeSeen=false, afterglowSeen=false;
          async function clickWhenReady(){
            await rewardBoard.locator('button:not([disabled])').first().waitFor({state:'visible',timeout:15000});
            await rewardBoard.locator('button:not([disabled])').first().click();
          }
          async function observeCycle(){
            for(let i=0;i<190;i++){
              await reward.waitForTimeout(60);
              const chain=reward.locator('[class*="boardWrap"][data-chain="1"], [class*="boardWrap"][data-chain="2"], [class*="boardWrap"][data-chain="3"], [class*="boardWrap"][data-chain="4"]');
              if(!chainEdgeSeen && await chain.isVisible().catch(()=>false)){
                chainEdgeSeen=true;
                await reward.screenshot({path:'/tmp/overdrive-tactile-qa/03-chain-edge.jpg',type:'jpeg',quality:92});
              }
              const after=reward.locator('[class*="boardWrap"][data-afterglow="true"]');
              if(!afterglowSeen && await after.isVisible().catch(()=>false)){
                afterglowSeen=true;
                await reward.screenshot({path:'/tmp/overdrive-tactile-qa/04-jackpot-afterglow.jpg',type:'jpeg',quality:92});
              }
              const enabled=await rewardBoard.locator('button:not([disabled])').count();
              if(enabled>0 && i>35) break;
            }
          }
          await clickWhenReady(); await observeCycle();
          await clickWhenReady(); await observeCycle();
          if(!afterglowSeen){
            for(let i=0;i<80;i++){
              await reward.waitForTimeout(70);
              const after=reward.locator('[class*="boardWrap"][data-afterglow="true"]');
              if(await after.isVisible().catch(()=>false)){afterglowSeen=true;await reward.screenshot({path:'/tmp/overdrive-tactile-qa/04-jackpot-afterglow.jpg',type:'jpeg',quality:92});break;}
            }
          }
          await reward.screenshot({path:'/tmp/overdrive-tactile-qa/05-active.jpg',type:'jpeg',quality:92});
          const b=await rewardBoard.boundingBox(); const feed=await reward.locator('[class*="actionFeed"]').boundingBox();
          const result={errors,backLayers,pressedSeen,burstSeen,scoreSeen,chainEdgeSeen,afterglowSeen,board:b,feed,scrollWidth:await reward.evaluate(()=>document.documentElement.scrollWidth),innerWidth:await reward.evaluate(()=>innerWidth)};
          fs.writeFileSync('/tmp/overdrive-tactile-qa/review.json',JSON.stringify(result,null,2));
          if(errors.length) throw new Error(errors.join('\n'));
          if(backLayers<6) throw new Error(`background depth layers missing ${backLayers}`);
          if(!pressedSeen || !burstSeen || !scoreSeen) throw new Error(`tactile feedback incomplete ${JSON.stringify(result)}`);
          if(!chainEdgeSeen || !afterglowSeen) throw new Error(`reward escalation incomplete ${JSON.stringify(result)}`);
          if(b && feed && feed.y < b.y+b.height) throw new Error('action feed overlaps board');
          if(result.scrollWidth>result.innerWidth) throw new Error('horizontal overflow');
          await browser.close();
          NODE
          node qa-overdrive-tactile.mjs
          rm qa-overdrive-tactile.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: prism-overdrive-tactile-depth-qa
          path: /tmp/overdrive-tactile-qa
          retention-days: 1
      - name: Commit and cleanup
        run: |
          rm -f scripts/pass-overdrive-tactile-depth.py .github/workflows/pass-overdrive-tactile-depth.yml
          git config user.name 'yz4git'
          git config user.email '65384484+yz4git@users.noreply.github.com'
          git add app/PrismOverdrive.tsx app/PrismOverdrive.module.css app/gameAudio.ts scripts .github/workflows
          git commit -m 'Deepen Prism Overdrive tactile reward feedback'
          git push origin HEAD:main
