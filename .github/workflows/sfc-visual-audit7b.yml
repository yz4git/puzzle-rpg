name: SFC Visual Audit 7B

on:
  push:
    branches:
      - review/sfc-visual-audit7b-20260828

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start review server
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/puzzle-rpg-sfc7b.log 2>&1 &
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/puzzle-rpg-sfc7b.log
          exit 1
      - name: Run Pass 7B visual audit
        run: node scripts/sfc-visual-audit7b.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: puzzle-rpg-sfc-visual-audit7b
          path: sfc-visual-audit7b
