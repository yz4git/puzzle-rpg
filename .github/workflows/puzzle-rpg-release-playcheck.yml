name: Puzzle RPG Release Route Playcheck

on:
  push:
    paths:
      - .github/workflows/puzzle-rpg-release-playcheck.yml
  workflow_run:
    workflows: ["Deploy Puzzle RPG to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  PLAYCHECK_URL: https://yz4git.github.io/puzzle-rpg/

jobs:
  release-route:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install Playwright
        run: |
          mkdir -p /tmp/puzzle-rpg-release-check
          cd /tmp/puzzle-rpg-release-check
          npm init -y
          npm install --no-audit --no-fund playwright@latest
          npx playwright install --with-deps chromium
      - name: Play Forest Wisp release route
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-playcheck-artifacts"
          cat > /tmp/puzzle-rpg-release-check/check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          import path from 'node:path';

          const url = process.env.PLAYCHECK_URL;
          const out = path.join(process.env.GITHUB_WORKSPACE, 'release-playcheck-artifacts');
          const report = { assertions: [], scenes: [], consoleErrors: [], pageErrors: [], failedResponses: [] };
          const assert = (name, pass, detail = {}) => report.assertions.push({ name, pass: Boolean(pass), ...detail });
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 393, height: 852 }, screen: { width: 393, height: 852 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true, locale: 'ja-JP', colorScheme: 'dark' });
          const page = await context.newPage();
          page.on('console', msg => { if (msg.type() === 'error') report.consoleErrors.push(msg.text()); });
          page.on('pageerror', err => report.pageErrors.push(String(err)));
          page.on('response', res => { if (res.status() >= 400) report.failedResponses.push({ status: res.status(), url: res.url() }); });

          async function shot(name) {
            await page.waitForTimeout(420);
            const metrics = await page.evaluate(() => {
              const buttons = [...document.querySelectorAll('button')].filter(el => {
                const s = getComputedStyle(el), r = el.getBoundingClientRect();
                return s.display !== 'none' && s.visibility !== 'hidden' && r.width > 0 && r.height > 0 && r.bottom > 0 && r.top < innerHeight;
              }).map(el => {
                const r = el.getBoundingClientRect();
                return { text: (el.innerText || el.getAttribute('aria-label') || '').replace(/\s+/g, ' ').trim().slice(0,120), width: Math.round(r.width), height: Math.round(r.height), x: Math.round(r.x), y: Math.round(r.y) };
              });
              return {
                text: document.body.innerText.replace(/\s+/g, ' ').slice(0,8000),
                width: document.documentElement.scrollWidth,
                height: document.documentElement.scrollHeight,
                buttons,
                tinyButtons: buttons.filter(b => b.width < 44 || b.height < 44),
              };
            });
            report.scenes.push({ name, ...metrics });
            await page.screenshot({ path: path.join(out, `${name}.png`), fullPage: true });
            return metrics;
          }

          async function tap(name) {
            const button = page.getByRole('button', { name });
            if (!(await button.count())) return false;
            await button.first().tap({ force: true });
            return true;
          }

          const save = {
            version: 1, playerName: 'LIO', level: 1, exp: 0, hp: 22, maxHp: 22, gold: 18,
            mapId: 'world', position: { x: 10, y: 19 }, direction: 'right',
            lastInn: { mapId: 'hearthVillage', position: { x: 8, y: 10 } },
            inventory: [{ id: 'herb', count: 2 }], inventorySlots: 4,
            equipmentOwned: ['travellerCoat'], equipment: { weapon: null, armor: 'travellerCoat', charm: null },
            techniques: [], techniqueSlots: 2,
            memos: [{ id: 'journey', title: '最初の旅', text: '北のOld Templeへ向かう。', read: false }],
            flags: ['story:openingSeen'], openedChests: [], defeatedEncounters: [], defeatedEnemies: {}, releasedEnemies: {}, battleLog: [],
            steps: 20, playSeconds: 60, encounterMeter: 12, settings: { music: false, sfx: false },
          };

          await page.goto(`${url}?release_route=${Date.now()}`, { waitUntil: 'networkidle', timeout: 60000 });
          await page.evaluate(value => localStorage.setItem('puzzle-rpg:rpg-mode:v1', JSON.stringify(value)), save);
          await page.reload({ waitUntil: 'networkidle' });
          await page.getByRole('button', { name: /RPG MODE/i }).tap();
          const cont = page.getByRole('button', { name: /CONTINUE/i });
          if (await cont.count()) await cont.first().tap();
          const before = await shot('01-before-wisp');
          assert('Fixed encounter marker is reachable', /PRISM ROAD/i.test(before.text));

          await tap(/A\s*CHECK/i);
          await page.waitForTimeout(800);
          const battle = await shot('02-wisp-battle');
          assert('A CHECK opens fixed FOREST WISP battle', /FOREST WISP/i.test(battle.text) && /TURN 1/i.test(battle.text));

          for (let index = 1; index <= 3; index++) {
            await tap(/RPG COMMAND/i);
            await page.waitForTimeout(120);
            await tap(/^TALK/i);
            await page.waitForTimeout(index === 3 ? 1300 : 1550);
            if (index < 3) {
              const scene = await shot(`0${index + 2}-after-talk-${index}`);
              assert(`TALK ${index} remains in battle`, new RegExp(`TURN ${index + 1}`).test(scene.text) && /FOREST WISP/i.test(scene.text));
            }
          }

          const result = await shot('05-release-result');
          assert('Third peaceful TALK reaches alternative resolution', /ANOTHER ANSWER/i.test(result.text));
          assert('Release reward text is shown', /やさしい手|GENTLE|EXP \+4|GOLD \+1/i.test(result.text));
          assert('Result screen touch targets meet 44px', result.tinyButtons.length === 0, { tiny: result.tinyButtons });

          await tap(/CONTINUE/i);
          await page.waitForTimeout(700);
          const field = await shot('06-returned-field');
          assert('Release result returns to field', /PRISM ROAD/i.test(field.text) && !/ANOTHER ANSWER/i.test(field.text));
          const stored = await page.evaluate(() => JSON.parse(localStorage.getItem('puzzle-rpg:rpg-mode:v1') || '{}'));
          assert('Release persists gentleHand technique', Array.isArray(stored.techniques) && stored.techniques.includes('gentleHand'));
          assert('Release persists forestWisp flag', Array.isArray(stored.flags) && stored.flags.includes('release:forestWisp'));
          assert('Fixed encounter is recorded cleared', Array.isArray(stored.defeatedEncounters) && stored.defeatedEncounters.includes('world-wisp'));

          report.consoleErrors = [...new Set(report.consoleErrors)];
          report.pageErrors = [...new Set(report.pageErrors)];
          report.failedResponses = report.failedResponses.filter((value, index, all) => all.findIndex(item => item.status === value.status && item.url === value.url) === index);
          await writeFile(path.join(out, 'report.json'), JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          await browser.close();

          const failures = report.assertions.filter(a => !a.pass);
          if (failures.length || report.consoleErrors.length || report.pageErrors.length || report.failedResponses.some(r => r.status >= 400)) process.exitCode = 1;
          EOF
          cd /tmp/puzzle-rpg-release-check
          node check.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-rpg-release-route-playcheck
          path: release-playcheck-artifacts
          retention-days: 2
