name: SFC Visual Reconstruction Pass 9
on:
  push:
    branches: [visual/reconstruction-pass-sfc9]
    paths:
      - scripts/apply-sfc-visual-pass9.py
      - .github/workflows/visual-reconstruction-sfc9.yml
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/reconstruction-pass-sfc9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/apply-sfc-visual-pass9.py
      - run: npx tsc -p tsconfig.puzzle.json --noEmit
      - run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - run: git diff --check && git diff --stat
      - name: Save implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/rpg/RPGMode.tsx app/rpg/RPGMode.module.css PROGRESS.md
          git commit -m 'Implement SFC visual reconstruction pass 9'
          git push origin HEAD:visual/reconstruction-pass-sfc9
