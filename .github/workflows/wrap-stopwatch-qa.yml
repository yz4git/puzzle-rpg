name: Wrap Stopwatch QA Payloads
on:
  push:
    paths:
      - '.github/workflows/wrap-stopwatch-qa.yml'
jobs:
  wrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wrap screenshot payloads
        run: |
          fold -w 500 qa-stopwatch-armed.b64 > qa-stopwatch-armed-wrapped.txt
          fold -w 500 qa-stopwatch-zero.b64 > qa-stopwatch-zero-wrapped.txt
          rm qa-stopwatch-armed.b64 qa-stopwatch-zero.b64 .github/workflows/wrap-stopwatch-qa.yml
      - name: Commit wrapped payloads
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Wrap stopwatch QA screenshots for inspection'
          git push origin main
