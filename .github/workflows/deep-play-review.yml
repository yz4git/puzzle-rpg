name: Deep Play Review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deep-play-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start app
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/puzzle-rpg-vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/puzzle-rpg-vite.log
          exit 1
      - name: Play and capture
        run: |
          mkdir -p deep-play
          cat > deep-play.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:402,height:874},isMobile:true,hasTouch:true,deviceScaleFactor:3});
          const page = await context.newPage();
          const errors=[];
          page.on('console',m=>{ if(m.type()==='error') errors.push(m.text()); });
          page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});

          const safeText = async (sel) => (await page.locator(sel).first().textContent().catch(()=>''))?.trim() || '';
          const visible = async (sel) => page.locator(sel).first().isVisible().catch(()=>false);
          const snap = async (name) => page.screenshot({path:`deep-play/${name}.png`,fullPage:true});

          const readState = async () => page.evaluate(() => {
            const txt=(s)=>document.querySelector(s)?.textContent?.trim()||'';
            const enemy=document.querySelector('[aria-label="enemy status"]');
            const player=document.querySelector('[aria-label="player status"]');
            const intents=document.querySelector('[aria-label="enemy intents"]');
            const msg=document.querySelector('[role="status"]');
            const stage=[...document.querySelectorAll('*')].find(el=>/^STAGE \d+$/.test(el.textContent?.trim()||''))?.textContent?.trim()||'';
            const skill=[...document.querySelectorAll('button')].find(b=>b.textContent?.includes('PRISM SHIFT'))?.textContent?.replace(/\s+/g,' ').trim()||'';
            return {stage, enemy:enemy?.textContent?.replace(/\s+/g,' ').trim()||'', player:player?.textContent?.replace(/\s+/g,' ').trim()||'', intents:intents?.textContent?.replace(/\s+/g,' ').trim()||'', message:msg?.textContent?.replace(/\s+/g,' ').trim()||'', skill};
          });

          const parseBoard = async () => {
            const labels=await page.locator('button[aria-label*=" orb row "]').evaluateAll(btns=>btns.map(b=>b.getAttribute('aria-label')||''));
            const board=Array.from({length:6},()=>Array(6).fill(''));
            for(const label of labels){
              const m=label.match(/^(fire|water|light|heart|guard) orb row (\d+) column (\d+)$/);
              if(m) board[+m[2]-1][+m[3]-1]=m[1];
            }
            return board;
          };
          const clone=b=>b.map(r=>[...r]);
          const sw=(b,a,c)=>{const n=clone(b);[n[a.r][a.c],n[c.r][c.c]]=[n[c.r][c.c],n[a.r][a.c]];return n};
          const matchSet=b=>{
            const out=new Set();
            for(let r=0;r<6;r++){let s=0;for(let c=1;c<=6;c++){if(c<6&&b[r][c]===b[r][s])continue;if(c-s>=3)for(let x=s;x<c;x++)out.add(`${r}:${x}`);s=c;}}
            for(let c=0;c<6;c++){let s=0;for(let r=1;r<=6;r++){if(r<6&&b[r][c]===b[s][c])continue;if(r-s>=3)for(let y=s;y<r;y++)out.add(`${y}:${c}`);s=r;}}
            return out;
          };
          const allPairs=()=>{const p=[];for(let r=0;r<6;r++)for(let c=0;c<6;c++){if(c<5)p.push([{r,c},{r,c:c+1}]);if(r<5)p.push([{r,c},{r:r+1,c}]);}return p};
          const pairs=allPairs();

          const pickMove = async () => {
            const board=await parseBoard();
            const state=await readState();
            const hp=Number((state.player.match(/HP\s*(\d+)/)||[])[1]||100);
            const def=Number((state.player.match(/DEF\s*(\d+)/)||[])[1]||0);
            const enemyHp=Number((state.enemy.match(/(\d+)\s*\/\s*(\d+)/)||[])[1]||999);
            const danger=/CRUSH|PIERCE|BLOOD RITE|PRISM HIT|VOID CRUSH/.test(state.intents);
            let best=null;
            for(const [a,b] of pairs){
              const nb=sw(board,a,b); const ms=matchSet(nb); if(!ms.size) continue;
              let score=ms.size*3;
              const counts={fire:0,water:0,light:0,heart:0,guard:0};
              for(const key of ms){const [r,c]=key.split(':').map(Number);counts[nb[r][c]]++;}
              score+=(counts.fire*7+counts.water*6+counts.light*8);
              if(hp<72) score+=counts.heart*10; else score+=counts.heart*2;
              if(danger||def<12) score+=counts.guard*11; else score+=counts.guard*3;
              if(enemyHp<45) score+=(counts.fire+counts.water+counts.light)*5;
              if(!best||score>best.score) best={a,b,score,counts};
            }
            if(best) return {board,...best,setup:false,state};
            let bestSetup=null;
            for(const [a,b] of pairs){
              const nb=sw(board,a,b); let future=0;
              for(const [x,y] of pairs) if(matchSet(sw(nb,x,y)).size) future++;
              if(!bestSetup||future>bestSetup.future) bestSetup={a,b,future};
            }
            return {board,...bestSetup,setup:true,state};
          };

          const clickCoord = async (board,p) => page.getByRole('button',{name:`${board[p.r][p.c]} orb row ${p.r+1} column ${p.c+1}`}).click();
          const waitTurn = async () => {
            for(let i=0;i<80;i++){
              if(await visible('[class*="stageClearOverlay"]')) { await page.waitForTimeout(150); continue; }
              if(await visible('[class*="stageIntroOverlay"]')) return 'intro';
              const disabled=await page.locator('button[aria-label*=" orb row "]:disabled').count();
              if(disabled===0) return 'ready';
              await page.waitForTimeout(75);
            }
            return 'timeout';
          };

          const log=[];
          let introCount=0;
          if(await visible('[class*="stageIntroOverlay"]')){
            introCount++;
            await snap(`stage-${introCount}-intro`);
            log.push({event:'intro',state:await readState()});
            await page.getByRole('button',{name:'BATTLE START'}).click();
            await page.waitForTimeout(180);
          }
          await snap('battle-start');

          for(let turn=1;turn<=28;turn++){
            if(await visible('[class*="gameOverCard"]')) { log.push({event:'gameover',turn,state:await readState()}); await snap(`turn-${String(turn).padStart(2,'0')}-gameover`); break; }

            if(await visible('[class*="stageIntroOverlay"]')){
              introCount++;
              await snap(`stage-${introCount}-intro`);
              log.push({event:'intro',turn,state:await readState()});
              await page.getByRole('button',{name:'BATTLE START'}).click();
              await page.waitForTimeout(180);
            }

            const choice=await pickMove();
            log.push({event:'choice',turn,choice:{a:choice.a,b:choice.b,score:choice.score??null,counts:choice.counts??null,setup:choice.setup,future:choice.future??null},before:choice.state});
            await clickCoord(choice.board,choice.a);
            await clickCoord(choice.board,choice.b);
            await page.waitForTimeout(90);
            if(turn<=5 || turn%4===0) await snap(`turn-${String(turn).padStart(2,'0')}-swap`);
            await page.waitForTimeout(190);
            if(turn<=5 || turn%4===0) await snap(`turn-${String(turn).padStart(2,'0')}-fx`);
            const status=await waitTurn();
            if(status==='intro'){
              await snap(`turn-${String(turn).padStart(2,'0')}-clear-to-intro`);
            } else if(turn<=6 || turn%3===0){
              await snap(`turn-${String(turn).padStart(2,'0')}-result`);
            }
            log.push({event:'result',turn,status,after:await readState()});
          }

          const metrics=await page.evaluate(()=>({viewport:[innerWidth,innerHeight],scroll:[document.documentElement.scrollWidth,document.documentElement.scrollHeight],buttons:document.querySelectorAll('button[aria-label*=" orb row "]').length}));
          fs.writeFileSync('deep-play/report.json',JSON.stringify({log,metrics,errors},null,2));
          console.log(JSON.stringify({turnEvents:log.length,metrics,errors,last:log.slice(-4)},null,2));
          await browser.close();
          EOF
          node deep-play.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: deep-play-review
          path: deep-play/
