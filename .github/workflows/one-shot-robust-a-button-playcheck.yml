name: One-shot robust A button playcheck

on:
  push:
    paths:
      - '.github/workflows/one-shot-robust-a-button-playcheck.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make field A selector independent of label text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/live-playcheck.mjs')
          s = p.read_text()
          start = s.index('async function startFixedBattle(page, expectedName, attempts = 6) {')
          end = s.index('\n}\n\nasync function openCommand', start) + 2
          new = (
              "async function tapFieldA(page) {\n"
              "  const action = page.locator('button[class*=\\\"aButton\\\"]').first();\n"
              "  if (!(await action.count())) return false;\n"
              "  await action.tap({ force: true });\n"
              "  await page.waitForTimeout(140);\n"
              "  return true;\n"
              "}\n\n"
              "async function startFixedBattle(page, expectedName, attempts = 6) {\n"
              "  const launcher = page.getByRole('button', { name: /RPG COMMAND/i }).first();\n"
              "  for (let attempt = 0; attempt < attempts; attempt++) {\n"
              "    if (await launcher.isVisible().catch(() => false)) {\n"
              "      return expectedName.test(await bodyText(page));\n"
              "    }\n"
              "    await tapFieldA(page);\n"
              "    await page.waitForTimeout(580);\n"
              "  }\n"
              "  const ready = await launcher.waitFor({ state: 'visible', timeout: 2500 }).then(() => true).catch(() => false);\n"
              "  return ready && expectedName.test(await bodyText(page));\n"
              "}"
          )
          s = s[:start] + new + s[end:]
          s = s.replace("await tap(page, /A(?:\\s*•)?\\s*(?:CHECK|CONFRONT)/i);", "await tapFieldA(page);")
          p.write_text(s)
          PY
      - name: Commit patch and remove runner
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-robust-a-button-playcheck.yml
          git add scripts/live-playcheck.mjs
          git commit -m 'Make live playcheck field A selector robust'
          git push
