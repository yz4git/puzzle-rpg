name: Stabilize Adjacent Choice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stabilize-adjacent-choice.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Keep adjacent targets spatially stable
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/PuzzleRPGGame.module.css')
          s=p.read_text()
          old='@keyframes adjacentPulse { to { transform:scale(.96); box-shadow:inset 0 0 0 2px rgba(255,255,255,.26),0 0 15px rgba(91,222,255,.62); } }'
          new='@keyframes adjacentPulse { from { box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 0 5px rgba(91,222,255,.22); } to { box-shadow:inset 0 0 0 2px rgba(255,255,255,.3),0 0 18px rgba(91,222,255,.72); } }'
          if old not in s: raise SystemExit('adjacentPulse target missing')
          p.write_text(s.replace(old,new,1))
          PY
          npx tsc -p tsconfig.puzzle.json --noEmit
          bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Commit
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add app/PuzzleRPGGame.module.css
          git commit -m "Keep adjacent choice targets tap-stable"
          git push origin HEAD:main
