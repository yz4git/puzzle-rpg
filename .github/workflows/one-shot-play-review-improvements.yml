name: One-shot play review improvements

on:
  push:
    paths:
      - '.github/workflows/one-shot-play-review-improvements.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply play review improvements
        run: python3 scripts/one-shot-play-review-improvements.py

      - name: Commit improvements and clean helpers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-play-review-improvements.yml scripts/one-shot-play-review-improvements.py
          git add app/rpg/RPGMode.tsx app/rpg/RPGMode.module.css app/rpg/RPGPuzzleBattle.module.css scripts/live-playcheck.mjs
          git commit -m 'Improve world-first portrait play experience'
          git push
