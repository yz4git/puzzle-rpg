name: One-shot play review improvements

on:
  push:
    paths:
      - '.github/workflows/one-shot-play-review-improvements.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply field viewport, command sheet, and playcheck improvements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Give iPhone portrait more actual game world: 13x13 -> 13x15.
          mode = Path('app/rpg/RPGMode.tsx')
          s = mode.read_text()
          old = 'const VIEW_H = 13;'
          new = 'const VIEW_H = 15;'
          if old not in s and new not in s:
              raise SystemExit('VIEW_H anchor not found')
          if old in s:
              s = s.replace(old, new, 1)
          mode.write_text(s)

          # 2) Field composition: taller world, collapse the elastic dead strip,
          #    keep large touch targets and let goal info float closer to the world.
          field_css = Path('app/rpg/RPGMode.module.css')
          css = field_css.read_text()
          marker = '/* Play review pass 35 — world-first portrait composition */'
          if marker not in css:
              css += r'''

/* Play review pass 35 — world-first portrait composition */
/* The gameplay grid is now 13x15, so portrait space becomes visible world instead of a black UI spacer. */
.rpg{
  grid-template-rows:auto auto auto auto 0 minmax(150px,1fr);
  align-content:stretch;
}
.worldFrame{
  aspect-ratio:13/15;
  min-height:0;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent2) 42%,#23212a),0 5px 16px rgba(0,0,0,.28);
}
.fieldBrief{
  position:absolute;
  z-index:12;
  left:max(12px,env(safe-area-inset-left));
  right:max(12px,env(safe-area-inset-right));
  bottom:152px;
  margin:0;
  padding:0;
  pointer-events:none;
  display:block;
  background:transparent;
}
.fieldGoal{
  min-height:42px;
  max-width:72%;
  padding:5px 11px 5px 13px;
  background:linear-gradient(90deg,rgba(7,7,12,.93),rgba(7,7,12,.74) 78%,transparent);
  backdrop-filter:blur(1.5px);
}
.fieldGoal small{display:none}
.fieldQuick{display:none}
.controls{
  min-height:150px;
  height:auto;
  margin:0;
  padding:8px 10px max(8px,env(safe-area-inset-bottom));
  align-self:stretch;
  align-items:flex-start;
  background:linear-gradient(180deg,rgba(7,7,12,.45),rgba(3,3,7,.9) 36%,#020205 100%);
}
.controls::after{top:62px}
.dpad{width:144px;height:144px;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}
.dpad button,.dpad i{min-width:48px;min-height:48px}
.abButtons{margin-top:25px}
.abButtons button{width:70px;height:60px}
.memoStrip{margin-top:-1px;background:linear-gradient(90deg,rgba(5,5,9,.88),rgba(5,5,9,.35),transparent)}
@media(max-width:380px){
  .fieldGoal{max-width:78%}
  .dpad{width:138px;height:138px;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}
  .dpad button,.dpad i{min-width:46px;min-height:46px}
  .abButtons button{width:64px;height:56px}
}
@media(max-height:700px){
  .rpg{grid-template-rows:auto auto auto auto 0 minmax(138px,1fr)}
  .fieldBrief{bottom:140px}
  .controls{min-height:138px;padding-top:5px}
  .dpad{width:132px;height:132px;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}
  .dpad button,.dpad i{min-width:44px;min-height:44px}
  .abButtons{margin-top:20px}.abButtons button{width:62px;height:54px}
}
'''
              field_css.write_text(css)

          # 3) Battle command window becomes a bottom tactical sheet. Main four commands
          #    use a 2x2 layout so the enemy and board remain visible behind it.
          battle_css = Path('app/rpg/RPGPuzzleBattle.module.css')
          bcss = battle_css.read_text()
          bmarker = '/* Play review pass 35 — tactical bottom command sheet */'
          if bmarker not in bcss:
              bcss += r'''

/* Play review pass 35 — tactical bottom command sheet */
.overlay{
  place-items:end center;
  padding:0 8px max(8px,env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(2,2,5,.12),rgba(2,2,5,.42) 48%,rgba(2,2,5,.82));
  backdrop-filter:blur(1.5px);
}
.commandWindow{
  width:min(100%,430px);
  max-height:52dvh;
  overflow:auto;
  padding:8px 8px 7px;
  border-top:2px solid color-mix(in srgb,var(--sceneAccent) 74%,#fff1b3);
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%,0 10px);
  background:linear-gradient(180deg,rgba(13,14,22,.97),rgba(5,6,10,.985));
  box-shadow:0 -12px 34px rgba(0,0,0,.55),inset 3px 0 var(--sceneAccent);
}
.commandWindow>span{
  padding:3px 6px 5px 8px;
  background:transparent;
  border-bottom:1px solid color-mix(in srgb,var(--sceneAccent) 45%,#55545e);
  font-size:9px;
}
/* Main RPG COMMAND has TALK/ITEM/STATUS/RUN plus CLOSE: make the four actions a 2x2 tactical bank. */
.commandWindow:has(> button:nth-of-type(5)){
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:4px;
}
.commandWindow:has(> button:nth-of-type(5))>span,
.commandWindow:has(> button:nth-of-type(5))>.statusPanel,
.commandWindow:has(> button:nth-of-type(5))>.close{
  grid-column:1/-1;
}
.commandWindow button{
  min-height:52px;
  padding:6px 8px 6px 19px;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
}
.commandWindow button>b{font-size:9px}
.commandWindow small{font-size:6.5px}
.close{min-height:44px!important;margin-top:1px}
@media(max-height:700px){
  .commandWindow{max-height:56dvh;padding:6px}
  .commandWindow button{min-height:48px}
  .close{min-height:44px!important}
}
'''
              battle_css.write_text(bcss)

          # 4) Consolidated live playcheck: robustly wait for the actual command launcher,
          #    and add town + first dungeon screenshots to the visual review set.
          test = Path('scripts/live-playcheck.mjs')
          t = test.read_text()
          old_block = '''  // Fixed encounters can spend a short moment in the encounter cue before the
  // battle root mounts. Wait for the real battle instead of assuming 650ms is enough.
  let itemBattleReady = false;
  for (let attempt = 0; attempt < 3 && !itemBattleReady; attempt += 1) {
    itemBattleReady = await page.locator('main[data-enemy]').waitFor({ state: 'visible', timeout: 1600 }).then(() => true).catch(() => false);
    if (!itemBattleReady) {
      await tap(page, /A\\s*CHECK/i);
      await page.waitForTimeout(280);
    }
  }
  assert('Item route opens FOREST WISP battle', itemBattleReady && /FOREST WISP/i.test(await bodyText(page)));
  let win = null;
  for (let attempt = 0; attempt < 3 && !win; attempt += 1) {
    win = await openCommand(page);
    if (!win) await page.waitForTimeout(360);
  }
  if (!win) throw new Error('RPG COMMAND did not become available in item route');
'''
          new_block = '''  // Wait on the actual player-facing command launcher. This survives cue timing
  // changes and avoids relying on an implementation-specific battle root selector.
  const itemLauncher = page.getByRole('button', { name: /RPG COMMAND/i }).first();
  const itemBattleReady = await itemLauncher.waitFor({ state: 'visible', timeout: 8000 }).then(() => true).catch(() => false);
  assert('Item route opens FOREST WISP battle', itemBattleReady && /FOREST WISP/i.test(await bodyText(page)));
  if (!itemBattleReady) {
    await snapshot(page, '13-item-route-diagnostic');
    throw new Error('RPG COMMAND did not become available in item route');
  }
  const win = await openCommand(page);
  if (!win) throw new Error('RPG COMMAND launcher was visible but could not open');
'''
          if old_block in t:
              t = t.replace(old_block, new_block, 1)
          elif new_block not in t:
              raise SystemExit('item playcheck anchor not found')

          town_marker = '// 3) Forest Wisp non-violent alternative resolution and persistence.'
          visual_block = '''// Visual review: town and first dungeon composition after the world-first viewport pass.\n{\n  const { context, page } = await makePage('visual-areas');\n  await enterSeededRpg(page, 'visual-town', baseSave({ mapId: 'hearthVillage', position: { x: 8, y: 10 }, direction: 'up' }));\n  await snapshot(page, '09a-hearth-village');\n  await context.close();\n}\n{\n  const { context, page } = await makePage('visual-temple');\n  await enterSeededRpg(page, 'visual-temple', baseSave({ mapId: 'oldTemple', position: { x: 10, y: 21 }, direction: 'up' }));\n  await snapshot(page, '09b-old-temple');\n  await context.close();\n}\n\n'''
          if '09a-hearth-village' not in t:
              if town_marker not in t:
                  raise SystemExit('visual review insertion anchor not found')
              t = t.replace(town_marker, visual_block + town_marker, 1)
          test.write_text(t)
          PY

      - name: Commit improvements and remove one-shot runner
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-play-review-improvements.yml
          git add app/rpg/RPGMode.tsx app/rpg/RPGMode.module.css app/rpg/RPGPuzzleBattle.module.css scripts/live-playcheck.mjs
          git commit -m 'Improve world-first portrait play experience'
          git push
