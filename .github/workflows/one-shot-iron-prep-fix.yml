name: One-shot Iron Tyrant preparation pass

on:
  push:
    paths:
      - '.github/workflows/one-shot-iron-prep-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch realistic Iron City preparation and strategy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/live-playcheck.mjs')
          s = p.read_text()
          old = "async function fightBossSmart(page, maxActions = 70, herbLimit = 2) {\n  let actions = 0;\n  let herbsUsed = 0;\n  const decisions = [];\n"
          new = "async function fightBossSmart(page, maxActions = 70, herbLimit = 2) {\n  let actions = 0;\n  let herbsUsed = 0;\n  let guardStonesUsed = 0;\n  const decisions = [];\n  const strategicSave = await storedSave(page);\n  const canOverheal = strategicSave.techniques?.includes('overheal');\n"
          if old not in s: raise SystemExit('fightBossSmart header anchor not found')
          s = s.replace(old, new, 1)
          old = "    if (hp <= 7 && herbsUsed < herbLimit) {\n      const used = await useBattleItem(page, /HERB/i);\n      if (used) {\n        herbsUsed += 1;\n        actions += 1;\n        decisions.push({ action: 'HERB', hp, barrier, free, heavy });\n        await page.waitForTimeout(1150);\n        continue;\n      }\n    }\n\n    let chosen = null;\n    if (free > 0 && attack) chosen = attack;\n    else if (heavy && barrier < 7 && guard) chosen = guard;\n    else if (hp <= Math.max(9, maxHp - 8) && heal) chosen = heal;\n"
          new = "    if (heavy && barrier < 5) {\n      const used = await useBattleItem(page, /GUARD STONE/i);\n      if (used) {\n        guardStonesUsed += 1;\n        actions += 1;\n        decisions.push({ action: 'GUARD STONE', hp, barrier, free, heavy });\n        await page.waitForTimeout(1150);\n        continue;\n      }\n    }\n\n    if (hp <= 7 && herbsUsed < herbLimit) {\n      const used = await useBattleItem(page, /HERB/i);\n      if (used) {\n        herbsUsed += 1;\n        actions += 1;\n        decisions.push({ action: 'HERB', hp, barrier, free, heavy });\n        await page.waitForTimeout(1150);\n        continue;\n      }\n    }\n\n    let chosen = null;\n    if (free > 0 && attack) chosen = attack;\n    else if (heavy && barrier < 7 && guard) chosen = guard;\n    else if (canOverheal && heal && barrier < 6 && heal.size >= Math.max(5, maxHp - hp + 2)) chosen = heal;\n    else if (hp <= Math.max(9, maxHp - 8) && heal) chosen = heal;\n"
          if old not in s: raise SystemExit('boss strategy anchor not found')
          s = s.replace(old, new, 1)
          old = "  return { actions, herbsUsed, decisions, text: await bodyText(page) };\n}\n\n// 6) First dungeon boss"
          new = "  return { actions, herbsUsed, guardStonesUsed, decisions, text: await bodyText(page) };\n}\n\n// 6) First dungeon boss"
          if old not in s: raise SystemExit('fightBossSmart return anchor not found')
          s = s.replace(old, new, 1)

          route = s.index('// 7) Midgame chain:')
          seed_start = s.index('  const ironSeed = {', route)
          seed_end = s.index('  };', seed_start) + len('  };')
          iron_seed = """  // Guaranteed boss rewards leave 105G. IRON SWORD (55G) + GUARD STONE x2 (40G) is an affordable minimum setup.
          const ironSeed = {
            ...scarletSave,
            mapId: 'ironCity',
            position: { x: 9, y: 6 },
            direction: 'up',
            hp: scarletSave.maxHp,
            gold: Math.max(0, scarletSave.gold - 95),
            inventory: [{ id: 'guardStone', count: 2 }],
            equipmentOwned: [...new Set([...(scarletSave.equipmentOwned ?? []), 'ironSword'])],
            equipment: { ...scarletSave.equipment, weapon: 'ironSword' },
            encounterMeter: 99,
          };"""
          s = s[:seed_start] + iron_seed + s[seed_end:]

          goal_pos = s.index("  assert('NEXT GOAL advances to IRON CITY after Scarlet Oracle'", route)
          goal_end = s.index('\n', goal_pos) + 1
          s = s[:goal_end] + "  assert('Iron City goal teaches boss preparation', /GUARD STONE/i.test(scarletReturn.text), { text: scarletReturn.text.slice(0, 1400) });\n" + s[goal_end:]

          iron_start = "  assert('A CHECK opens IRON TYRANT after Scarlet Oracle', /IRON TYRANT/i.test(ironStart.text));\n"
          iron_extra = "  const preparedIronSave = await storedSave(page);\n  assert('Iron Tyrant test uses only affordable Iron City preparation', preparedIronSave.gold === 10 && preparedIronSave.equipment?.weapon === 'ironSword' && preparedIronSave.inventory?.find?.(item => item.id === 'guardStone')?.count === 2, { gold: preparedIronSave.gold, equipment: preparedIronSave.equipment, inventory: preparedIronSave.inventory });\n"
          if iron_start not in s: raise SystemExit('iron start assertion anchor not found')
          s = s.replace(iron_start, iron_start + iron_extra, 1)
          p.write_text(s)

          p = Path('app/rpg/RPGMode.tsx')
          s = p.read_text()
          old = 'if (flag("boss:scarletOracle")) return { title: "IRON CITY", text: "SCARLET ORACLEを越えた。IRON CITYへ戻り、IRON TYRANTと向き合う。" };'
          new = 'if (flag("boss:scarletOracle")) return { title: "IRON CITY", text: "SCARLET ORACLEを越えた。IRON CITYへ戻り、鍛冶屋で装備とGUARD STONEを整えてIRON TYRANTと向き合う。" };'
          if old not in s: raise SystemExit('Iron City NEXT GOAL anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-iron-prep-fix.yml
          git add scripts/live-playcheck.mjs app/rpg/RPGMode.tsx
          git diff --cached --check
          git commit -m 'Teach and verify Iron Tyrant preparation'
          git push origin HEAD:main
