name: Graphics v2 Playcheck

on:
  push:
    branches: [main]
    paths:
      - 'qa-v2-playcheck.mjs'
      - '.github/workflows/v2-playcheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start game
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/puzzle.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:4173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/puzzle.log
          exit 1
      - name: Play and capture
        run: node qa-v2-playcheck.mjs
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphics-v2-playcheck
          path: qa-v2-artifacts
          if-no-files-found: warn
