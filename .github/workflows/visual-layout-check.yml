name: Portrait Layout QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-layout-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start app
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/puzzle-rpg-vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/puzzle-rpg-vite.log
          exit 1
      - name: Capture portrait layouts
        run: |
          mkdir -p portrait-layout
          cat > qa-layout.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const report = [];
          for (const vp of [{name:'iphone17-402x874',width:402,height:874},{name:'compact-390x844',width:390,height:844}]) {
            const context = await browser.newContext({viewport:{width:vp.width,height:vp.height},isMobile:true,hasTouch:true,deviceScaleFactor:3});
            const page = await context.newPage();
            const errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await page.screenshot({path:`portrait-layout/${vp.name}.png`,fullPage:true});
            const metrics=await page.evaluate(()=>{
              const rect=s=>{const r=document.querySelector(s)?.getBoundingClientRect();return r?{x:r.x,y:r.y,w:r.width,h:r.height,bottom:r.bottom}:null};
              const tiles=[...document.querySelectorAll('button[aria-label*=" orb row "]')].map(el=>{const r=el.getBoundingClientRect();return {w:r.width,h:r.height,bottom:r.bottom}});
              const nextCols=[...document.querySelectorAll('[aria-label^="column "][aria-label$=" next"]')].map(el=>{const r=el.getBoundingClientRect();return {x:r.x+r.width/2,w:r.width}});
              const board=rect('[aria-label="puzzle board"]');
              const tileCenters=[...document.querySelectorAll('button[aria-label*=" orb row 1 column "]')].map(el=>{const r=el.getBoundingClientRect();return r.x+r.width/2});
              return {viewport:[innerWidth,innerHeight],scroll:[document.documentElement.scrollWidth,document.documentElement.scrollHeight],board,next:rect('[aria-label="column next puzzle orbs"]'),action:rect('button[class*="skillButton"]'),tile:tiles[0],hiddenTiles:tiles.filter(t=>t.bottom>innerHeight).length,tileCenters,nextCenters:nextCols.map(c=>c.x)};
            });
            report.push({...vp,...metrics,errors});
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('portrait-layout/report.json',JSON.stringify(report,null,2));
          EOF
          node qa-layout.mjs
          cat portrait-layout/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: portrait-layout
          path: portrait-layout/
