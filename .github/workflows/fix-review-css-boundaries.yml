name: Fix Review CSS Boundaries

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_review_css_boundaries.py'
      - '.github/workflows/fix-review-css-boundaries.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean CSS boundaries
        run: python3 scripts/fix_review_css_boundaries.py
      - name: Install dependencies
        run: npm ci
      - name: Puzzle RPG TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Commit cleanup
        run: |
          rm -f scripts/fix_review_css_boundaries.py .github/workflows/fix-review-css-boundaries.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix early-game review CSS boundaries'
          git push origin HEAD:main
