name: Puzzle RPG CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Puzzle RPG TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Start review server
        run: |
          (npm run dev -- --hostname 127.0.0.1 --port 5173 > /tmp/puzzle-review.log 2>&1 &)
          sleep 5
      - name: Capture preview alignment and FX stacking
        run: node scripts/preview-fx-align-review.mjs
      - name: Upload visual review
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-rpg-preview-fx-review
          path: review-artifacts
