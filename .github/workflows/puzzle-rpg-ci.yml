name: Puzzle RPG CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/puzzle-rpg-ci.yml'
      - 'scripts/apply-review-pass-1-5.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install image tooling
        run: python -m pip install --quiet pillow
      - name: Apply review pass 1-5
        run: python scripts/apply-review-pass-1-5.py
      - name: Puzzle RPG TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/PuzzleRPGGame.tsx app/PuzzleRPGGame.module.css public/assets/pixel8/orbs/heart.png
          git commit -m 'Implement review pass 1-5 and separate heart palette'
          git push origin HEAD:main
