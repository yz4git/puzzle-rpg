name: Puzzle RPG CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/puzzle-rpg-ci.yml'
      - 'scripts/apply-animation-intro-intent-pass.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply animation intro intent pass
        run: python scripts/apply-animation-intro-intent-pass.py
      - name: Puzzle RPG TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/PuzzleRPGGame.tsx app/PuzzleRPGGame.module.css
          git commit -m 'Fix panel animation visibility and emphasize battle planning'
          git push origin HEAD:main
