name: SFC Visual Reconstruction Pass 8B
on:
  push:
    branches: [visual/reconstruction-pass-sfc8b]
    paths:
      - scripts/apply-sfc-visual-pass8b.py
      - .github/workflows/visual-reconstruction-sfc8b.yml
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/reconstruction-pass-sfc8b
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/apply-sfc-visual-pass8b.py
      - run: npx tsc -p tsconfig.puzzle.json --noEmit
      - run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - run: git diff --check && git diff --stat
      - name: Save correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/rpg/RPGMode.tsx PROGRESS.md
          git commit -m 'Refine SFC visual reconstruction pass 8'
          git push origin HEAD:visual/reconstruction-pass-sfc8b
