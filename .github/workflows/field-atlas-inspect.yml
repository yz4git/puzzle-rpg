name: Field Atlas Inspect
on:
  push:
    branches: [review/sfc-visual-audit4-20260828]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: field-atlas-inspect
          path: public/assets/rpg/atlas/field.png
          if-no-files-found: error
