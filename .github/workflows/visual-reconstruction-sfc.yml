name: SFC Visual Reconstruction Pass

on:
  push:
    branches:
      - visual/reconstruction-pass-sfc

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply visual reconstruction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-sfc-visual-pass.mjs')
          lines = path.read_text().splitlines()
          for index, line in enumerate(lines):
              if 'progress +=' in line:
                  lines[index] = "  progress += '\\n\\n' + marker + '\\n- Restore point: restore/pre-visual-reconstruction-pass\\n- Target: late-SNES-inspired 16bit+ presentation.\\n- Phase 1 implementation: denser field layout, larger hero/NPC silhouettes, regional UI palettes, compact field menu, scene-specific battle backdrops, grounded enemies, 340-388px RPG battle board, SNES-styled battle frame, dedicated TALK reaction window.\\n- Validation required: TypeScript, production build, iPhone 402x690 visual audit, Chapter Battle regression check.\\n- Next asset phase: replace prototype CSS battle scenery with dedicated pixel background strips and expand region-specific terrain/autotiles.\\n';"
          path.write_text('\n'.join(lines) + '\n')
          PY
          node scripts/apply-sfc-visual-pass.mjs

      - name: TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit

      - name: Production build
        run: npm run build

      - name: Review diff
        run: |
          git status --short
          git diff --stat
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/rpg/RPGMode.tsx app/rpg/RPGMode.module.css app/rpg/RPGPuzzleBattle.tsx app/rpg/RPGPuzzleBattle.module.css docs/VISUAL_RECONSTRUCTION_BIBLE.md PROGRESS.md
          git commit -m "Implement SFC visual reconstruction pass"
          git push origin HEAD:visual/reconstruction-pass-sfc
