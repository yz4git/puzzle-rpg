name: Tactical UX Visual QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tactical-ux-visual-qa.yml'

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start app
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/puzzle-rpg-vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/puzzle-rpg-vite.log
          exit 1
      - name: Run visual QA
        run: |
          mkdir -p tactical-qa
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:402,height:874},isMobile:true,hasTouch:true,deviceScaleFactor:3});
          const page=await context.newPage();
          const errors=[];
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          const snap=n=>page.screenshot({path:`tactical-qa/${n}.png`,fullPage:true});
          const visible=s=>page.locator(s).first().isVisible().catch(()=>false);
          const parseBoard=async()=>{
            const labels=await page.locator('button[aria-label*=" orb row "]').evaluateAll(bs=>bs.map(b=>b.getAttribute('aria-label')||''));
            const b=Array.from({length:6},()=>Array(6).fill(''));
            for(const l of labels){const m=l.match(/^(fire|water|light|heart|guard) orb row (\d+) column (\d+)$/);if(m)b[+m[2]-1][+m[3]-1]=m[1]}
            return b;
          };
          const clone=b=>b.map(r=>[...r]);
          const swap=(b,a,c)=>{const n=clone(b);[n[a.r][a.c],n[c.r][c.c]]=[n[c.r][c.c],n[a.r][a.c]];return n};
          const matches=b=>{const out=new Set();for(let r=0;r<6;r++){let s=0;for(let c=1;c<=6;c++){if(c<6&&b[r][c]===b[r][s])continue;if(c-s>=3)for(let x=s;x<c;x++)out.add(`${r}:${x}`);s=c}}for(let c=0;c<6;c++){let s=0;for(let r=1;r<=6;r++){if(r<6&&b[r][c]===b[s][c])continue;if(r-s>=3)for(let y=s;y<r;y++)out.add(`${y}:${c}`);s=r}}return out};
          const pairs=[];for(let r=0;r<6;r++)for(let c=0;c<6;c++){if(c<5)pairs.push([{r,c},{r,c:c+1}]);if(r<5)pairs.push([{r,c},{r:r+1,c}])}
          const click=async(board,p)=>page.getByRole('button',{name:`${board[p.r][p.c]} orb row ${p.r+1} column ${p.c+1}`}).click();
          const waitReady=async()=>{for(let i=0;i<100;i++){if(await visible('[class*="stageIntroOverlay"]'))return 'intro';const d=await page.locator('button[aria-label*=" orb row "]:disabled').count();if(d===0)return 'ready';await page.waitForTimeout(80)}return 'timeout'};

          await snap('01-title');
          const titleVisible=await visible('[class*="titleScreen"]');
          await page.getByRole('button',{name:'START GAME'}).click();
          await page.waitForTimeout(120);
          await snap('02-intro');
          const introVisible=await visible('[class*="stageIntroOverlay"]');
          await page.getByRole('button',{name:'BATTLE START'}).click();
          await page.waitForTimeout(140);
          const board0=await parseBoard();
          await click(board0,{r:2,c:2});
          await page.waitForTimeout(100);
          const adjacentCount=await page.locator('button[class*="adjacentChoice"]').count();
          await snap('03-selection-guide');
          await click(board0,{r:2,c:2});

          const board1=await parseBoard();
          let setupPair=null,matchPair=null;
          for(const p of pairs){const m=matches(swap(board1,p[0],p[1]));if(m.size===0&&!setupPair)setupPair=p;if(m.size>0&&!matchPair)matchPair=p;if(setupPair&&matchPair)break}
          if(setupPair){
            await click(board1,setupPair[0]);await click(board1,setupPair[1]);
            await page.locator('[class*="damageVignette"]').waitFor({state:'visible',timeout:5000}).catch(()=>{});
            await snap('04-setup-damage');
            await waitReady();
          }
          const afterSetupText=(await page.locator('[role="status"]').textContent().catch(()=>''))||'';
          const skillText=(await page.getByRole('button',{name:/PRISM SHIFT/}).textContent().catch(()=>''))||'';

          const board2=await parseBoard();
          matchPair=null;
          for(const p of pairs){if(matches(swap(board2,p[0],p[1])).size>0){matchPair=p;break}}
          if(matchPair){
            await click(board2,matchPair[0]);await click(board2,matchPair[1]);
            await page.locator('[class*="playerAttackFx"]').waitFor({state:'visible',timeout:6000}).catch(()=>{});
            await snap('05-panel-to-enemy-attack');
            await waitReady();
          }
          await snap('06-after-turn');
          const metrics=await page.evaluate(()=>({viewport:[innerWidth,innerHeight],scroll:[document.documentElement.scrollWidth,document.documentElement.scrollHeight],buttons:document.querySelectorAll('button[aria-label*=" orb row "]').length}));
          fs.writeFileSync('tactical-qa/report.json',JSON.stringify({titleVisible,introVisible,adjacentCount,setupPair,afterSetupText,skillText,metrics,errors},null,2));
          console.log(fs.readFileSync('tactical-qa/report.json','utf8'));
          await browser.close();
          EOF
          node qa.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tactical-ux-qa
          path: tactical-qa/
