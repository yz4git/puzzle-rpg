name: Implement Chapter 1 Build System

on:
  push:
    branches:
      - feature/chapter1-battle-rewards

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/chapter1-battle-rewards
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fix patch boundaries
        run: python3 scripts/fix-chapter1-patcher.py
      - name: Apply Chapter 1 patch
        run: python3 scripts/implement-chapter1-build.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/PuzzleRPGClusterBreak.tsx app/PuzzleRPGChapter1.module.css
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "Implement Chapter 1 battle rewards and build system"
          git push origin HEAD:feature/chapter1-battle-rewards
