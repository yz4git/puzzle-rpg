name: Bootstrap Puzzle RPG from Sky Dancer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.repository == 'yz4git/puzzle-rpg'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Copy Sky Dancer foundation
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/yz4git/sky-dancer.git /tmp/sky-dancer
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.openai/hosting.json' \
            /tmp/sky-dancer/ ./

      - name: Retarget project identity and portrait PWA metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          package = Path('package.json')
          data = json.loads(package.read_text())
          data['name'] = 'puzzle-rpg'
          data['displayName'] = 'Puzzle RPG'
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          lock = Path('package-lock.json')
          if lock.exists():
              data = json.loads(lock.read_text())
              data['name'] = 'puzzle-rpg'
              root = data.get('packages', {}).get('')
              if isinstance(root, dict):
                  root['name'] = 'puzzle-rpg'
              lock.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          manifest = Path('public/manifest.json')
          if manifest.exists():
              data = json.loads(manifest.read_text())
              data['name'] = 'Puzzle RPG'
              data['short_name'] = 'Puzzle RPG'
              data['orientation'] = 'portrait'
              data['description'] = 'A portrait puzzle RPG designed for iPhone.'
              manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

          cat > README.md <<'EOF'
          # Puzzle RPG

          iPhoneの縦画面を主対象にしたパズルRPGです。

          ## Foundation

          `yz4git/sky-dancer` の実績あるWeb/iPhoneゲーム基盤を初期テンプレートとして複製し、`yz4git/puzzle-rpg` 用に分離しています。

          - React / TypeScript / Vite / Next-compatible build foundation
          - PWA / service worker foundation
          - iPhone Safari向けの既存運用・検証基盤
          - GitHub Actions CI / WebGL audit foundation

          ## Project rules

          - Target repository: `yz4git/puzzle-rpg` only
          - Primary device: iPhone Safari
          - Primary orientation: portrait
          - Do not reuse Sky Dancer's ChatGPT Sites project/hosting identity
          - Build the puzzle-RPG gameplay as a new game while reusing only suitable platform/runtime foundations
          EOF

          cat > AGENTS.md <<'EOF'
          # Puzzle RPG development notes

          This repository is `yz4git/puzzle-rpg`.

          ## Non-negotiable project constraints
          - Primary target: iPhone Safari in portrait orientation.
          - Keep touch controls, safe-area insets, dynamic viewport height, orientation changes, audio resume, visibility changes, and PWA behavior reliable on iPhone.
          - This project was bootstrapped from `yz4git/sky-dancer`, but Sky Dancer gameplay and branding are not product requirements.
          - Never deploy using Sky Dancer's ChatGPT Sites project identity. Create/use a Puzzle RPG-specific hosting configuration only when publishing is explicitly set up.
          - Do not modify `yz4git/sky-dancer` while working on this repository.
          - Save meaningful progress to GitHub frequently so work is recoverable.

          ## Direction
          Build a portrait-first puzzle RPG with a fast readable touch puzzle board, short combat turns, RPG progression, satisfying skill/chain feedback, and strong one-handed usability.
          EOF

      - name: Commit bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No bootstrap changes to commit"
            exit 0
          fi
          git commit -m "Bootstrap Puzzle RPG from Sky Dancer foundation"
          git push origin HEAD:main
