name: SFC Pass 32 Visual Consistency

on:
  push:
    paths:
      - '.github/workflows/pass32-visual-consistency.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply visual consistency pass
        run: python3 scripts/pass32_visual_consistency.py
      - name: Install dependencies
        run: npm ci
      - name: Puzzle RPG TypeScript check
        run: npx tsc -p tsconfig.puzzle.json --noEmit
      - name: Production build
        run: bash scripts/sites-env.sh -- ./node_modules/.bin/vinext build
      - name: Commit pass
        run: |
          rm -f scripts/pass32_visual_consistency.py .github/workflows/pass32-visual-consistency.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement SFC visual reconstruction pass 32'
          git push
